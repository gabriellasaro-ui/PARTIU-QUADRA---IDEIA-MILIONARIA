<div class="route-page" data-explore-page>
  <header class="explore-header">
    <div>
      <span>Partiu jogar</span>
      <div class="title" data-results-title>Explore quadras</div>
      <div class="sub" data-results-sub>Carregando resultados...</div>
    </div>
    <!-- Botao de mapa removido: o Mapa e o botao central da barra de baixo,
         grande e sempre visivel. Um atalho a mais no canto so competia com
         ele e ocupava o lugar de nada. -->
  </header>

  <div class="container explore-market">
    <form class="explore-search" data-search-form>
      <i class="ic" data-lucide="search"></i>
      <input type="search" name="q" placeholder="Arena, esporte ou bairro" autocomplete="off">
      <input type="hidden" name="raio" value="5">
      <input type="hidden" name="local" value="Goiânia, GO" data-search-location>
      <!-- Habilitado: campo disabled some do FormData, e o fragmento e
           rebaixado a cada navegacao. Buscar antes do render religar mandava
           a URL sem esporte. Valor vazio ja e descartado pelo laco acima. -->
      <input type="hidden" name="esporte" value="" data-search-sport>
      <input type="hidden" name="agora" value="1" data-search-now disabled>
      <!-- FUNIL, e nao os controles deslizantes.

           `sliders-horizontal` e o icone de ajustes/preferencias em quase todo
           app — quem bate o olho le "configuracoes", nao "filtrar". O funil e
           o simbolo universal de filtro e nao divide significado com nada. -->
      <button type="button" aria-label="Abrir filtros" data-sheet-open="filter-sheet" aria-expanded="false">
        <i class="ic" data-lucide="funnel"></i>
      </button>
    </form>

    <!-- A fileira de chips de esporte saiu.

         Ela repetia, em forma de atalho, o mesmo filtro que a folha ao lado ja
         oferece — e ocupava a linha logo abaixo da busca, empurrando os
         resultados para baixo em toda visita. Quem quer filtrar por esporte
         abre o funil; quem chegou pela home ja veio com o esporte na URL. -->
    <div class="result-context">
      <span><i class="ic" data-lucide="navigation"></i><strong data-current-location>Goiânia, GO</strong></span>
      <a href="#mapa">Ver mapa</a>
    </div>
    <!-- GRADE, e nao lista.

         Em coluna unica o card media 358x380 e so 2,2 cabiam na tela: com uma
         cidade de arenas, achar a certa viraria rolagem sem fim. Em duas
         colunas cada card fica com 173px, que ainda comporta foto, nome, nota
         e preco — e a tela passa a mostrar quatro de uma vez.

         `auto-fill` com minimo de 160px: em celular largo, tablet ou desktop a
         propria grade acrescenta colunas sozinha, sem media query nova. -->
    <div class="venue-grid" data-venue-list></div>
  </div>
</div>
