<div class="route-page reservations-page">
  <div class="navbar">
    <div>
      <div class="title">Minhas reservas</div>
      <div class="sub">Seus jogos agendados</div>
    </div>
    <span class="spacer"></span>
    <!-- Sem .icon-btn: aquela classe desenha o circulo dos botoes de acao
         (voltar, fechar), e aqui o icone e so enfeite do titulo. Com o
         circulo, parecia clicavel e nao acontecia nada ao tocar — pior do
         que nao ter icone nenhum. -->
    <span class="navbar-emblema"><i class="ic" data-lucide="ticket"></i></span>
  </div>

  <div class="container">
    <div class="seg" role="tablist" data-seg data-target="#minhas-reservas">
      <button type="button" class="seg-item on" data-filter="proxima">Próximas</button>
      <button type="button" class="seg-item" data-filter="historico">Histórico</button>
    </div>

    <div class="mobile-section-head" data-plan-head hidden>
      <h2>Suas mensalidades</h2>
      <span>Quadra garantida toda semana</span>
    </div>
    <div data-plan-list></div>

    <div id="minhas-reservas">
      <div data-reservation-list></div>
      <div data-empty hidden class="empty">
        <div class="empty-ic"><i class="ic lg" data-lucide="calendar-x"></i></div>
        <h3>Nada por aqui</h3>
        <p>Suas reservas desta categoria aparecerão aqui.</p>
      </div>
    </div>
  </div>
</div>
