<div class="route-page mobile-map-route" data-map-page>
  <div class="navbar map-navbar">
    <div>
      <div class="title">Mapa de quadras</div>
      <div class="sub" data-map-summary>Quadras perto de você</div>
    </div>
    <span class="spacer"></span>
    <button class="icon-btn" type="button" data-map-locate aria-label="Usar minha localização">
      <i class="ic" data-lucide="locate-fixed"></i>
    </button>
  </div>

  <!-- A FAIXA DE MODALIDADE SAIU.

       Ela ocupava uma tira inteira acima do mapa so para escolher esporte —
       numa tela cujo unico objetivo e ver o mapa. Agora o mapa comeca ali, e o
       filtro virou um botao FLUTUANDO sobre ele, que abre uma lista de
       multipla escolha. Ocupa espaco so quando esta aberto, e permite mais de
       um esporte ao mesmo tempo, o que a fileira de chips nao permitia. -->

  <div class="leaflet-map-shell">
    <div class="leaflet-mobile-map" data-live-map aria-label="Mapa interativo das quadras"></div>
    <div class="map-location-label"><span></span>Você está aqui</div>

    <div class="map-filter-float" data-map-filter-box>
      <button class="map-filter-btn" type="button" data-map-filter-toggle aria-expanded="false">
        <i class="ic" data-lucide="sliders-horizontal"></i>
        <span data-map-filter-label>Todas</span>
        <i class="ic map-filter-btn__chev" data-lucide="chevron-down"></i>
      </button>
      <div class="map-filter-list" data-map-filter-list hidden role="group" aria-label="Modalidades"></div>
    </div>
  </div>
</div>
