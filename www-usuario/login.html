<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Entrar - Qadras</title>
  <!-- O login virou rota do SPA (#entrar): so assim o ?next= sobrevive e a
       pessoa volta para onde estava. Este arquivo continua existindo porque
       ROUTES.login, o middleware e a topbar do desktop apontavam para ca. -->
  <script>
    var busca = location.search.replace(/^\?/, '');
    location.replace('./index.html#entrar' + (busca ? '?' + busca : ''));
  </script>
</head>
<body></body>
</html>
