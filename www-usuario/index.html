  <title>Qadras</title>
  <script>
    /* Layout por APARELHO, nunca por largura da janela.

       Antes isto ouvia matchMedia('change') com breakpoint de largura: dar
       zoom no navegador encolhe a viewport CSS, o evento disparava e a
       pagina era TROCADA — era isso o "quando dou zoom ele abre a versao
       mobile". Aparelho nao muda de tipo no meio da sessao, entao nao ha
       listener nenhum aqui: a decisao e tomada uma vez, na carga.

       Escape: ?layout=web força o desktop, ?layout=mobile força o mobile. */
    (function () {
      var cap = window.Capacitor;
      var nativo = Boolean(cap && cap.isNativePlatform && cap.isNativePlatform());
      var params = new URLSearchParams(window.location.search);
      var forcado = params.get('layout');
      var temPonteiroFino = window.matchMedia('(any-pointer: fine)').matches;
      var toque = nativo
        || (!temPonteiroFino
            && ((window.matchMedia('(pointer: coarse)').matches
                 && window.matchMedia('(hover: none)').matches)
                || (navigator.maxTouchPoints || 0) > 1));

      var raiz = document.documentElement;
      raiz.dataset.device = toque ? 'touch' : 'pointer';
      raiz.dataset.runtime = nativo ? 'app' : 'web';

      /* Contrapartida do desvio em app.html: no navegador, index.html sempre
         devolve para a versao web, inclusive em celular. Fica aqui so quem e
         app instalado ou pediu o layout mobile de proposito. */
      if (nativo || forcado === 'mobile' || params.get('modo') === 'app') return;

      var url = new URL('./app.html', window.location.href);
      url.search = window.location.search;
      url.hash = window.location.hash || '#quadras';
      window.location.replace(url.href);
    })();
  </script>

  <!-- A FOLHA DE FONTE NAO SEGURA MAIS A PRIMEIRA PINTURA.
       Como <link rel="stylesheet"> comum ela bloqueia a renderizacao ate
       responder — e ela mora num servidor de fora. No app instalado isso e uma
       ida a internet a cada abertura: com sinal ruim a tela fica em branco
       esperando, e sem sinal fica ate o tempo esgotar. Nada disso e sobre a
       fonte em si, que ja vinha com `display=swap` e nunca segurou o texto.
       `media="print"` faz o navegador buscar sem bloquear; o onload devolve
       para `all` quando chega. O <noscript> cobre quem desliga o script. -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"></noscript>
  <!-- CASCATA DE MODULOS: 27 arquivos descobertos em quatro viagens ─────────
       O navegador so descobre um import DEPOIS de baixar e ler quem importa.
       Medido aqui, os modulos comecavam em quatro ondas — 315ms, 636ms, 940ms
       e 1500ms — e a tela ficava em branco ate a ultima terminar: primeira
       pintura com conteudo aos 2,8s, sem nada de rede lenta no meio.

       `modulepreload` conta a arvore inteira de uma vez, na primeira viagem.
       Nao muda semantica nenhuma (nao executa nada, so busca) e o navegador
       ignora o que nao reconhecer.

       Se um caminho daqui sumir do codigo, o efeito e um aviso no console e um
       arquivo baixado a toa — nao uma tela quebrada. -->
