  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorar quadras - Qadras</title>
  <script>
    /* Layout por APARELHO, nunca por largura da janela.

       Antes isto ouvia matchMedia('change') com breakpoint de largura: dar
       zoom no navegador encolhe a viewport CSS, o evento disparava e a
       pagina era TROCADA — era isso o "quando dou zoom ele abre a versao
       mobile". Aparelho nao muda de tipo no meio da sessao, entao nao ha
       listener nenhum aqui: a decisao e tomada uma vez, na carga.

       Escape: ?layout=web força o desktop, ?layout=mobile força o mobile. */
    (function () {
      var cap = window.Capacitor;
      var nativo = Boolean(cap && cap.isNativePlatform && cap.isNativePlatform());
      var params = new URLSearchParams(window.location.search);
      var forcado = params.get('layout');
      var temPonteiroFino = window.matchMedia('(any-pointer: fine)').matches;
      var toque = nativo
        || (!temPonteiroFino
            && ((window.matchMedia('(pointer: coarse)').matches
                 && window.matchMedia('(hover: none)').matches)
                || (navigator.maxTouchPoints || 0) > 1));

      var raiz = document.documentElement;
      raiz.dataset.device = toque ? 'touch' : 'pointer';
      raiz.dataset.runtime = nativo ? 'app' : 'web';

      /* No NAVEGADOR nunca sai daqui, nem em celular: app.html E a versao
         web, e ela e responsiva ate a largura de telefone. index.html e o
         layout do app instalado — mandar o navegador para la entregava a
         experiencia do aplicativo (aba Inicio, notificacoes, menu) para quem
         nunca instalou nada, e sem caminho de volta para conta e perfil.

         So o app nativo, ou ?layout=mobile explicito, atravessa. */
      if (!nativo && forcado !== 'mobile') return;

      var url = new URL('./index.html', window.location.href);
      url.search = window.location.search;
      url.hash = window.location.hash;
      window.location.replace(url.href);
    })();
  </script>
