"M 0,0 H -9.052 C -6.43,0.111 -3.428,0.111 0,0"/></svg>

  <!-- Ilustracao: decorativa, entao alt vazio e aria-hidden — quem usa leitor
       de tela nao ganha nada ouvindo a cena, e o titulo do card ja diz onde a
       pessoa esta. Fora do <main> de proposito: posicionada, ela precisa se
       apoiar no <body> e nao no <main>, que e deslocado 58% para a direita. -->
  <div class="web-login-art" aria-hidden="true">
    <img src="./assets/images/login-hero.webp" alt="" width="1280" height="720">
  </div>

  <main class="web-login-main">
    <form class="web-login-card" data-web-auth-form="register">
      <h1>Bora marcar <br>seu primeiro jogo!</h1>
      <p>Leva um minuto. Depois é só escolher a quadra.</p>
      <div class="inp">
        <label for="web-reg-name">Nome completo</label>
        <input id="web-reg-name" type="text" name="name" autocomplete="name" placeholder="Como o time te chama" required>
      </div>
      <div class="inp">
        <label for="web-reg-email">E-mail</label>
        <input id="web-reg-email" type="email" name="email" autocomplete="email" placeholder="voce@email.com" required>
      </div>
      <div class="inp">
        <label for="web-reg-password">Senha</label>
        <div class="inp-senha">
          <input id="web-reg-password" type="password" name="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" minlength="6" required>
          <button class="inp-olho" type="button" data-toggle-senha aria-label="Mostrar senha" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path data-olho-aberto d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
              <circle data-olho-aberto cx="12" cy="12" r="3"/>
              <path data-olho-fechado d="M10.6 5.2A9.9 9.9 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-2.7 3.6M6.6 6.6A18 18 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 4.5-1.1"/>
              <path data-olho-fechado d="m2 2 20 20"/>
            </svg>
          </button>
        </div>
      </div>
      <!-- Erro inline, e nao toast: esta pagina nao carrega o ui.js, entao
           window.pqToast nao existe aqui. A versao anterior chamava o toast
           e a falha passava em silencio absoluto. -->
      <p class="web-login-card__error" data-auth-error hidden role="alert"></p>
      <button class="btn btn-primary btn-lg" type="submit">Criar conta</button>
      <!-- Dois destinos excludentes para o mesmo lugar: com GOOGLE_CLIENT_ID
           entra o botao de verdade, desenhado pelo proprio Google; sem ele
           fica o preview desabilitado, so para a tela ficar completa. O
           preview nunca vira caminho clicavel. -->
      <div class="web-login-sep" data-google-area hidden><span>ou</span></div>
      <div class="web-login-google" data-google-button hidden></div>
      <button class="web-google-preview" type="button" data-google-preview hidden disabled>
        <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62Z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.92v2.33A9 9 0 0 0 9 18Z"/>
          <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.92a9 9 0 0 0 0 8.1l3.05-2.33Z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .92 4.95L3.97 7.28C4.68 5.16 6.66 3.58 9 3.58Z"/>
        </svg>
        <span>Criar conta com o Google</span>
        <em>em breve</em>
      </button>
      <div class="web-login-card__footer">Já tem conta? <a href="./login-web.html">Entrar</a></div>
    </form>
  </main>

  <script src="./config/app.config.js"></script>
  <script src="./assets/vendor/lucide/lucide.min.js"></script>
  <script type="module">
    import authService from './services/auth.js';

    window.lucide && window.lucide.createIcons();


    /* Primeiro acesso vai para o onboarding, sempre. Antes estas paginas
       mandavam direto para #quadras e so o mobile.js desviava — quem criava
       conta pela web nunca via posicao nem nivel, e o app depois tratava a
       pessoa como jogador sem perfil. */
    function destinoPosLogin(sessao) {
      const precisa = sessao?.isNew || authService.needsOnboarding();
      return precisa ? './app.html#onboarding?next=quadras' : './app.html#quadras';
    }

    const form = document.querySelector('[data-web-auth-form]');
    const erro = form.querySelector('[data-auth-error]');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      erro.hidden = true;
      const submit = form.querySelector('[type="submit"]');
      submit.setAttribute('disabled', 'disabled');
      try {
        const dados = Object.fromEntries(new FormData(form));
        const sessao = await (form.dataset.webAuthForm === 'register'
          ? authService.register(dados)
          : authService.login(dados));
        location.href = destinoPosLogin(sessao);
      } catch (error) {
        erro.textContent = error.message || 'Não foi possível continuar';
        erro.hidden = false;
      } finally {
        submit.removeAttribute('disabled');
      }
    });

    /* Login com Google. O botao e desenhado pelo proprio Google — na web e o
       unico jeito confiavel de abrir a escolha de conta; um botao nosso
       dependeria do One Tap, que o navegador suprime sem avisar.

       Sem client ID mostra o preview desabilitado no lugar: a tela fica
       completa sem prometer um caminho que ainda nao existe. */
    (async () => {
      const { GOOGLE_READY, mountGoogleButton } = await import('./services/google-auth.js');

      const area = document.querySelector('[data-google-area]');
      const alvo = document.querySelector('[data-google-button]');
      const previa = document.querySelector('[data-google-preview]');
      area.hidden = false;

      if (!GOOGLE_READY) {
        previa.hidden = false;
        return;
      }
      alvo.hidden = false;

      try {
        await mountGoogleButton(alvo, {
          text: 'signup_with',
          onCredential: async (credencial) => {
            erro.hidden = true;
            try {
              const sessao = await authService.exchangeGoogleCredential(credencial);
              location.href = destinoPosLogin(sessao);
            } catch (falha) {
              erro.textContent = falha.message || 'Não foi possível entrar com o Google';
              erro.hidden = false;
            }
          }
        });
      } catch (falha) {
        /* Google fora do ar ou bloqueado: cai no preview em vez de deixar um
           espaco morto no meio do formulario. */
        alvo.hidden = true;
        previa.hidden = false;
      }
    })();

    /* Olhinho da senha. Alterna o type do campo e troca o desenho do icone;
       aria-pressed conta a mesma coisa para leitor de tela. O <button> e
       type="button" de proposito — dentro de <form> o padrao e submit, e
       revelar a senha mandaria o formulario. */
    document.querySelectorAll('[data-toggle-senha]').forEach((botao) => {
      const campo = botao.closest('.inp-senha')?.querySelector('input');
      if (!campo) return;
      botao.addEventListener('click', () => {
        const revelando = campo.type === 'password';
        campo.type = revelando ? 'text' : 'password';
        botao.setAttribute('aria-pressed', String(revelando));
        botao.setAttribute('aria-label', revelando ? 'Ocultar senha' : 'Mostrar senha');
        /* Classe no botao, e nao `hidden` nos <path>: `hidden` e propriedade de
           HTMLElement — em SVG a atribuicao vira um campo solto no objeto e o
           desenho nunca muda. Quem esconde e o CSS. */
        botao.classList.toggle('inp-olho--revelando', revelando);
        /* Devolve o foco ao campo para nao quebrar o fluxo de digitacao. */
        campo.focus();
      });
    });
  </script>
</body>
