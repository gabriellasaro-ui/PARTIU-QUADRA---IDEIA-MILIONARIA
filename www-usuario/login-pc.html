<!DOCTYPE html>
<html lang="pt-br" data-player-desktop>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Qadras</title>
  <meta name="theme-color" content="#129653">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/desktop.css">
  <link rel="stylesheet" href="./assets/css/player-web.css">
</head>
<body class="web-login-page">
  <header class="web-login-bar">
    <a href="./pc.html#quadras" class="web-brand" aria-label="Qadras">
      <span class="web-brand__mark"><i class="ic" data-lucide="goal"></i></span>
      <span>Qadras</span>
    </a>
    <a class="back-link" href="./pc.html#quadras"><i class="ic sm" data-lucide="arrow-left"></i>Voltar</a>
  </header>

  <main class="web-login-main">
    <form class="web-login-card" data-web-auth-form="login">
      <h1>Entrar na sua conta</h1>
      <p>Acesse suas reservas, favoritos e mensagens.</p>
      <div class="inp">
        <label for="web-login-email">E-mail</label>
        <input id="web-login-email" type="email" name="email" autocomplete="email" placeholder="voce@email.com" required>
      </div>
      <div class="inp">
        <label for="web-login-password">Senha</label>
        <input id="web-login-password" type="password" name="password" autocomplete="current-password" placeholder="Sua senha" required>
      </div>
      <!-- Erro inline, e nao toast: esta pagina nao carrega o ui.js, entao
           window.pqToast nao existe aqui. A versao anterior chamava o toast
           e a falha passava em silencio absoluto. -->
      <p class="web-login-card__error" data-auth-error hidden role="alert"></p>
      <button class="btn btn-primary btn-lg" type="submit">Entrar</button>
      <div class="web-login-card__footer">Ainda não tem conta? <a href="./cadastro-pc.html">Criar conta</a></div>
    </form>
  </main>

  <script src="./config/app.config.js"></script>
  <script src="./assets/vendor/lucide/lucide.min.js"></script>
  <script type="module">
    import authService from './services/auth.js';

    window.lucide && window.lucide.createIcons();

    const form = document.querySelector('[data-web-auth-form]');
    const erro = form.querySelector('[data-auth-error]');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      erro.hidden = true;
      const submit = form.querySelector('[type="submit"]');
      submit.setAttribute('disabled', 'disabled');
      try {
        const dados = Object.fromEntries(new FormData(form));
        await (form.dataset.webAuthForm === 'register'
          ? authService.register(dados)
          : authService.login(dados));
        location.href = './pc.html#quadras';
      } catch (error) {
        erro.textContent = error.message || 'Não foi possível continuar';
        erro.hidden = false;
      } finally {
        submit.removeAttribute('disabled');
      }
    });
  </script>
</body>
</html>
