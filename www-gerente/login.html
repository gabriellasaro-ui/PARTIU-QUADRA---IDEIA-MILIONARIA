  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#9bcf33">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">

  <link rel="stylesheet" href="./assets/css/tema.css">
  <link rel="stylesheet" href="./assets/css/sistema.css">
  <script src="./assets/vendor/lucide/lucide.min.js" defer></script>
  <style>
    /* TUDO EM TOKEN, e nao em cor fixa.

       Esta folha nasceu com o cartao cravado em claro (#fff, #e3e8e3, texto
       sem cor declarada) — mas o painel abre no ESCURO por padrao. O titulo e
       os rotulos herdavam `--pq-ink`, que no escuro e uma tinta CLARA, e
       sumiam sobre o cartao branco: 1,12:1. Os campos, sem cor nem fundo
       declarados, caiam no padrao do navegador e apareciam cinza-chumbo no
       meio de um cartao branco.

       O logo tambem tinha o verde antigo (#1b7a3e) cravado aqui: como e CSS
       embutido no HTML, ficou de fora da troca de paleta, que varreu os
       arquivos .css. Era o ultimo esmeralda do projeto.

       Em token, a tela acompanha o tema em vez de brigar com ele. */
    /* ANCORADO EM html[data-manager-app], e nao so na classe.

       `manager-app.css` tem `html[data-manager-app] body { background-image:
       none }` — especificidade (0,2,1). Um `.gerente-login { background: ... }`
       e (0,1,0) e PERDE, esteja em que ordem estiver. O degrade suave que esta
       folha declarava desde o inicio nunca chegou a aparecer; medi no
       navegador (`backgroundImage` computado vinha `none`) ao investigar por
       que a ilustracao nao pintava no celular. */
    /* CLARA SEMPRE, e nao acompanhando o tema do painel.

       Esta e a mesma decisao do login do jogador, e ela e o que faz a
       ilustracao funcionar. A arte tem ceu branco; para ele sumir no fundo em
       vez de virar um retangulo colado, o unico recurso limpo e
       `mix-blend-mode: multiply` — que ESCURECE. Sobre o #111409 do tema
       escuro, multiply come a cena inteira.

       Tentei o contrario antes: manter a pagina escura e contornar com
       mascara radial e brilho reduzido. Ficou um holofote no meio do nada. A
       porta de entrada nao precisa herdar o tema do painel — ela vem ANTES de
       qualquer preferencia, e e igual para todo mundo. O tema volta a valer
       depois do login, onde a pessoa escolheu. */
    html[data-manager-app] body.gerente-login {
      position: relative;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fff;

      /* UMA medida para painel, arte e recuo do cartao. Os tres precisam bater
         no mesmo pixel: um valor a menos na arte e sobra uma faixa de verde
         antes do divisor; um a mais no recuo e o cartao pousa sobre a cena.

         O TETO DE 960px nao e estetica, e nitidez. O PNG original da arte tem
         941px de largura — esse e o teto real. Com o painel em 58% de uma tela
         de 1920 ele pedia 1114px e o navegador esticava 1,30x, que numa
         ilustracao chapada aparece como borda mole (foi o que voce viu). Em
         960 a arte e desenhada em tamanho praticamente nativo em qualquer
         monitor, inclusive ultrawide. */
      --painel: min(50%, 960px);
    }

    /* O PAINEL DA ESQUERDA — a moldura da cena.

       Sem ele a ilustracao flutua no branco e precisa de mascara para nao
       terminar em aresta. Com ele a aresta e INTENCIONAL: vira o divisor entre
       "a arena" e "o formulario", e a arte so encosta nele.

       O fio e a propria borda direita do painel. Um elemento a parte para a
       linha teria de ficar alinhado ao painel em toda largura, e qualquer
       arredondamento deixaria os dois fora de registro. */
    html[data-manager-app] body.gerente-login::before {
      content: '';
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--painel);
      border-right: 1px solid var(--pq-line);
      background: var(--pq-panel-2);
    }

    /* ── A ILUSTRACAO ──────────────────────────────────────────────────────

       ELA PREENCHE O PAINEL INTEIRO, e nao so o pe dele.

       Com a arte deitada ancorada embaixo — que e como o login do jogador faz —
       sobrava metade do painel em verde chapado, e a tela parecia inacabada. Lá
       aquilo funciona porque o ceu da cena e quase todo vazio e dissolve
       devagar; aqui a arte tem horizonte definido (predios, arvores) e o corte
       vira um bloco.

       Entao aqui entra a arte VERTICAL — a mesma do celular. O painel e uma
       coluna (835x900 numa tela de 1440), e uma imagem em retrato cobre isso
       sem faixa vazia. Nome de arquivo "mobile" e so a origem dela; a forma e
       que importa.

       `object-position: center 60%` foi escolhido comparando os quatro cortes
       lado a lado: com 100% (embaixo) a cabeca do dono fica de fora e sobra
       calcada; com 40% sobra ceu e os pes saem. Em 60% cabem o dono inteiro, a
       bola, a placa e o campo.

       O `multiply` continua: o ceu absorve o tom do painel, entao nao ha
       emenda no topo mesmo com a imagem encostando na borda. */
    .gerente-login__art {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--painel);
      /* A arte nao pode roubar clique do formulario. */
      pointer-events: none;
      /* SEM z-index — nem mesmo 0.

         Valor numerico em elemento posicionado cria contexto de empilhamento, e
         isso ISOLA o mix-blend-mode: a imagem passa a mesclar com o proprio
         container em vez do painel, e a emenda reta no topo do ceu reaparece.
         Foi exatamente o que aconteceu aqui — e o CSS do login do jogador ja
         documentava a armadilha. Posicionada e sem z-index, ela ja pinta depois
         do ::before; o cartao fica por cima pelo z-index dele. */
    }

    .gerente-login__art img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 60%;
      mix-blend-mode: multiply;
    }

    /* O cartao por cima da arte, sempre. */
    .gerente-login__card { position: relative; z-index: 1; }

    @media (min-width: 900px) {
      /* O cartao centra no que SOBRA depois do painel. `padding-left: 58%`
         empurra a caixa de conteudo para onde o painel termina, e o
         `justify-content: center` que ja existe faz o resto — igual ao
         `margin-left: 58%` do login do jogador. Encostado a direita, como
         estava antes, ele ficava desgarrado num canto. */
      html[data-manager-app] body.gerente-login {
        padding-left: var(--painel);
        padding-right: clamp(24px, 4vw, 64px);
      }
    }

    @media (max-width: 899px) {
      /* Espremidos, painel e arte viram uma tira sem leitura. A cena passa a
         ser o fundo da pagina inteira, ancorada EMBAIXO — e a parte de baixo
         (o dono, a bola, o portao) que conta a historia; o ceu e enchimento, e
         e ele que some primeiro quando a tela e baixa. */
      html[data-manager-app] body.gerente-login::before { display: none; }
      .gerente-login__art { display: none; }

      html[data-manager-app] body.gerente-login {
        padding-left: 24px;
        background:
          linear-gradient(to bottom, #fff 0%, rgba(255, 255, 255, .55) 34%, transparent 58%),
          url('./assets/images/login-hero-mobile.webp') no-repeat bottom center / cover,
          #fff;
      }

      /* Sobre a ilustracao, texto solto fica ilegivel assim que encosta no
         verde: o cartao ganha um veu proprio. */
      html[data-manager-app] body.gerente-login .gerente-login__card {
        background: rgba(255, 255, 255, .93);
        backdrop-filter: blur(3px);
      }
    }

    .gerente-login__card {
      width: 100%;
      max-width: 400px;
      background: var(--pq-panel);
      border: 1px solid var(--pq-line);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 18px 40px -24px rgba(10, 16, 6, .35);
    }
    /* A MARCA, e nao um "Q" de espera.

       O wordmark vai EMBUTIDO no HTML, e nao como <img src=...svg>: o desenho
       usa `fill: currentColor` para acompanhar a tinta do tema, e dentro de uma
       <img> nao existe `currentColor` herdado — sairia preto, invisivel no tema
       escuro. Mesmo motivo pelo qual a sidebar ja o embute. */
    .gerente-login__logo {
      display: flex;
      /* Centralizada (pedido do dono). O bloco de cabecalho inteiro acompanha:
         marca centrada com titulo a esquerda fica desalinhada, e o olho le a
         diferenca de 1px como erro. */
      justify-content: center;
      color: var(--pq-ink);
      margin-bottom: 20px;
    }
    .gerente-login__logo .qadras-logo { --logo-h: 26px; }
    .gerente-login h1,
    .gerente-login p.lead { text-align: center; }
    .gerente-login h1 { font-size: 22px; margin: 0 0 4px; color: var(--pq-ink); }
    .gerente-login p.lead { color: var(--pq-muted); margin: 0 0 24px; font-size: 14px; }
    .gerente-login label {
      display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px;
      color: var(--pq-ink);
    }
    .gerente-login input[type="email"],
    .gerente-login input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--pq-line);
      border-radius: 10px;
      font-size: 15px;
      /* Sem estes dois o campo caia no padrao do navegador — que segue o tema
         do SISTEMA, e nao o da pagina. */
      background: var(--pq-panel);
      color: var(--pq-ink);
    }
    .gerente-login input[type="email"]:focus,
    .gerente-login input[type="password"]:focus {
      outline: none;
      border-color: var(--pq-brand);
    }
    .gerente-login .btn { margin-top: 22px; width: 100%; }
    .gerente-login .error { color: var(--pq-danger); font-size: 13px; margin-top: 12px; min-height: 18px; }
    .gerente-login .hint {
      margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--pq-line);
      font-size: 12px; color: var(--pq-muted);
    }

    /* CADASTRO — a porta que faltava.

       Ate agora esta tela so servia quem JA tem conta, e conta de arena so
       nascia por seed: quem chegasse com uma quadra para cadastrar nao tinha
       para onde clicar. O botao fica separado do Entrar por uma linha e um
       texto curto, porque sao publicos diferentes — misturar os dois no mesmo
       bloco faz o dono novo tentar entrar com um e-mail que nao existe. */
    /* CARTAO INTEIRO CLICAVEL, e nao um botao de contorno solto.

       Como botao simples ele competia visualmente com o Entrar — duas caixas
       do mesmo tamanho, e quem chega com uma quadra nao sabia qual e a sua.
       Aqui vira outra COISA: superficie propria, icone, e uma linha dizendo o
       que ganha. O <a> envolve tudo, entao o alvo de toque e o cartao todo e
       nao 40px de texto. */
    .gerente-login__novo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 22px;
      padding: 14px 16px;
      border: 1px solid var(--pq-line);
      border-radius: 14px;
      background: var(--pq-tint);
      color: inherit;
      transition: border-color .12s, background .12s, transform .1s;
    }
    .gerente-login__novo:hover {
      border-color: var(--pq-brand);
      background: var(--pq-tint-strong);
    }
    .gerente-login__novo:active { transform: translateY(1px); }

    .gerente-login__novo .ico {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: var(--pq-brand);
      color: var(--pq-on-brand, #1f2e0b);
    }
    .gerente-login__novo .ico .ic { width: 20px; height: 20px; }

    .gerente-login__novo .txt { min-width: 0; flex: 1 1 auto; }
    .gerente-login__novo strong {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: var(--pq-ink);
    }
    .gerente-login__novo span {
      display: block;
      margin-top: 2px;
      font-size: 12.5px;
      line-height: 1.35;
      color: var(--pq-muted);
    }
    .gerente-login__novo .seta {
      flex: 0 0 auto;
      color: var(--pq-muted);
    }
    .gerente-login__novo:hover .seta { color: var(--pq-brand-deep); }

    /* ── ENTRAR COM O GOOGLE ───────────────────────────────────────────────

       Duas saidas excludentes para o mesmo lugar, igual ao login do jogador:
       com GOOGLE_CLIENT_ID entra o botao que o PROPRIO Google desenha (na web
       e o unico jeito confiavel de abrir a escolha de conta — um botao nosso
       dependeria do One Tap, que o navegador suprime sem avisar); sem ele fica
       a previa desabilitada, so para a tela nao ter um buraco. A previa nunca
       vira caminho clicavel. */
    .gerente-login__sep {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0 14px;
      font-size: 12px;
      color: var(--pq-muted);
    }
    .gerente-login__sep::before,
    .gerente-login__sep::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--pq-line);
    }
    .gerente-login__google { display: flex; justify-content: center; }
    .gerente-login__google > div { max-width: 100%; }

    .gerente-google-previa {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 11px 14px;
      border: 1px solid var(--pq-line);
      border-radius: 11px;
      background: var(--pq-panel);
      color: var(--pq-muted);
      font-size: 14px;
      font-weight: 600;
      cursor: not-allowed;
    }
    .gerente-google-previa em {
      font-style: normal;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--pq-tint);
      color: var(--pq-muted);
    }
  </style>
  <!-- TEMA ANTES DA PRIMEIRA PINTURA.

       `app.js` e `type="module"`, entao roda DEPOIS de o HTML ser lido: a
       pagina pintava sem atributo de tema — que o CSS trata como escuro, o
       padrao do painel — e so entao o JS aplicava o claro. Dava o flash preto
       a cada F5 para quem escolheu claro.

       Bloqueante e inline de proposito: qualquer coisa assincrona aqui volta a
       pintar antes. Le direto do localStorage porque `storage.js` e modulo, e
       importar um modulo teria o mesmo atraso que se esta corrigindo.

       O `try` cobre navegador com armazenamento bloqueado: sem tema aplicado a
       pagina abre escura, que e o padrao — nunca sem estilo. -->
  <script src="./config/app.config.js"></script>
  <script>
    (function () {
      try {
        var p = (window.__PQ_CONFIG__ && window.__PQ_CONFIG__.STORAGE_PREFIX) || 'pqg';
        if (JSON.parse(localStorage.getItem(p + ':tema')) === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
</head>

  <div class="gerente-login__art" aria-hidden="true">

    <h1>Painel da arena</h1>
    <p class="lead">Entre para gerenciar reservas, quadras e financeiro.</p>

    <form data-login-form novalidate>
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required minlength="6">
      <button type="submit" class="btn btn-primary">Entrar</button>
      <div class="error" data-login-error></div>
    </form>

    <div class="gerente-login__sep" data-google-area hidden><span>ou</span></div>
    <div class="gerente-login__google" data-google-button hidden></div>
    <button class="gerente-google-previa" type="button" data-google-previa hidden disabled>
      <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
