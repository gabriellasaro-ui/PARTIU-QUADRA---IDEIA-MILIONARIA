<!DOCTYPE html>
<html lang="pt-br" data-manager-app data-guest-page>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Entrar - Qadras Gerente</title>
  <meta name="theme-color" content="#9bcf33">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/desktop.css">
  <link rel="stylesheet" href="./assets/css/manager-app.css">
  <link rel="stylesheet" href="./assets/css/tema.css">
  <link rel="stylesheet" href="./assets/css/sistema.css">
  <script src="./assets/vendor/lucide/lucide.min.js" defer></script>
  <style>
    /* TUDO EM TOKEN, e nao em cor fixa.

       Esta folha nasceu com o cartao cravado em claro (#fff, #e3e8e3, texto
       sem cor declarada) — mas o painel abre no ESCURO por padrao. O titulo e
       os rotulos herdavam `--pq-ink`, que no escuro e uma tinta CLARA, e
       sumiam sobre o cartao branco: 1,12:1. Os campos, sem cor nem fundo
       declarados, caiam no padrao do navegador e apareciam cinza-chumbo no
       meio de um cartao branco.

       O logo tambem tinha o verde antigo (#1b7a3e) cravado aqui: como e CSS
       embutido no HTML, ficou de fora da troca de paleta, que varreu os
       arquivos .css. Era o ultimo esmeralda do projeto.

       Em token, a tela acompanha o tema em vez de brigar com ele. */
    /* ANCORADO EM html[data-manager-app], e nao so na classe.

       `manager-app.css` tem `html[data-manager-app] body { background-image:
       none }` — especificidade (0,2,1). Um `.gerente-login { background: ... }`
       e (0,1,0) e PERDE, esteja em que ordem estiver. O degrade suave que esta
       folha declarava desde o inicio nunca chegou a aparecer; medi no
       navegador (`backgroundImage` computado vinha `none`) ao investigar por
       que a ilustracao nao pintava no celular. */
    html[data-manager-app] body.gerente-login {
      position: relative;
      /* So no eixo X. Com `overflow: hidden` cheio, tela baixa (celular
         pequeno, ou teclado aberto empurrando a viewport) cortava o fim do
         formulario SEM deixar rolar ate ele — e o botao Entrar sumia. A arte
         nunca transborda na vertical: esta ancorada em bottom: 0. */
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(1200px 500px at 50% -10%, var(--pq-tint), transparent 60%),
        var(--pq-app-bg);
    }

    /* ── A ILUSTRACAO ──────────────────────────────────────────────────────

       Em tela larga ela ocupa a metade esquerda e o cartao vai para a direita;
       em tela estreita sai do fluxo e vira o fundo da pagina. Mesmo desenho do
       login do jogador (player-web.css), com UMA diferenca que muda tudo: o
       painel do gerente abre no ESCURO.

       O jogador usa `mix-blend-mode: multiply` para o ceu branco da cena
       absorver o painel. Multiply escurece — sobre o #111409 do tema escuro ele
       comeria a ilustracao inteira. Entao o blend e so no claro; no escuro a
       arte fica normal, com brilho reduzido para nao virar um bloco aceso no
       meio de uma tela preta.

       A MASCARA existe porque a arte e um RETANGULO e a pagina nao. Sem ela a
       cena termina em aresta reta dos dois lados — em cima, onde o ceu vira uma
       faixa cortada, e na direita, no meio do gramado, que e o corte mais
       visivel. Um radial ancorado no canto de baixo resolve os dois de uma vez.

       Tentei antes com dois gradientes lineares e `mask-composite: intersect`;
       medi no navegador e a segunda camada nao mordia — o pixel saltava de 130
       para 20 em dez pixels, ou seja, continuava corte seco. Uma camada so nao
       depende de composicao e da para conferir de olho.

       Os numeros (45% opaco, transparente em 88%) foram calibrados medindo o
       pixel na borda ate o degrade chegar ao fundo ANTES do fim do elemento —
       com 88% ele fecha por volta de 800px numa tela de 1440, e a arte encosta
       aos 979. Sobrando degrade, o corte reaparece. */
    .gerente-login__art {
      position: absolute;
      left: 0;
      bottom: 0;
      /* 68% da a cena inteira em tela larga, mas nunca invade os ~500px que o
         cartao precisa: em 1000px de largura a arte cede e para na metade. */
      width: min(68%, calc(100% - 500px));
      /* A arte nao pode roubar clique do formulario que passa por cima dela. */
      pointer-events: none;
      z-index: 0;
    }

    .gerente-login__art img {
      display: block;
      width: 100%;
      height: auto;
      -webkit-mask-image: radial-gradient(95% 118% at 16% 100%, #000 45%, transparent 88%);
      mask-image: radial-gradient(95% 118% at 16% 100%, #000 45%, transparent 88%);
      /* No escuro a cena e clara demais e viraria um bloco aceso sobre o
         #111409; o brilho reduzido a assenta sem apagar o verde. */
      filter: brightness(.78) saturate(1.05);
    }

    :root[data-theme="light"] .gerente-login__art img {
      mix-blend-mode: multiply;
      filter: none;
    }

    /* O cartao por cima da arte, sempre. */
    .gerente-login__card { position: relative; z-index: 1; }

    @media (min-width: 900px) {
      /* Cartao encostado a direita: centrado, ele pousaria em cima da cena. */
      html[data-manager-app] body.gerente-login {
        justify-content: flex-end;
        padding-right: clamp(24px, 7vw, 110px);
      }
    }

    @media (max-width: 899px) {
      /* Espremida a cena vira um borrao e ainda rouba altura do formulario.
         Vira fundo de pagina, ancorada EMBAIXO — e a parte de baixo (o dono, a
         bola, o portao) que conta a historia; o ceu e enchimento, e e ele que
         some primeiro quando a tela e baixa. */
      .gerente-login__art { display: none; }

      html[data-manager-app] body.gerente-login {
        /* Cartao NO TOPO, e nao centrado. Centrado ele ocupa a faixa do meio,
           que e exatamente onde esta o dono com a bola — a arte ficava atras do
           formulario e so sobravam cantos de mato. Em cima, a metade de baixo
           fica livre e a cena aparece inteira. */
        align-items: flex-start;
        padding-top: 20px;
        background:
          linear-gradient(to bottom, var(--pq-app-bg) 0%,
                          color-mix(in srgb, var(--pq-app-bg) 55%, transparent) 34%,
                          transparent 58%),
          url('./assets/images/login-hero-mobile.webp') no-repeat bottom center / cover,
          var(--pq-app-bg);
      }

      /* Sobre a ilustracao, texto solto fica ilegivel assim que encosta no
         verde: o cartao ganha um veu proprio. */
      html[data-manager-app] body.gerente-login .gerente-login__card {
        background: color-mix(in srgb, var(--pq-panel) 92%, transparent);
        backdrop-filter: blur(3px);
      }
    }
    .gerente-login__card {
      width: 100%;
      max-width: 400px;
      background: var(--pq-panel);
      border: 1px solid var(--pq-line);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 18px 40px -24px rgba(10, 16, 6, .35);
    }
    .gerente-login__logo {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--pq-brand);
      display: grid;
      place-items: center;
      color: var(--pq-on-brand, #1f2e0b);
      font-weight: 800;
      font-size: 20px;
      margin-bottom: 20px;
    }
    .gerente-login h1 { font-size: 22px; margin: 0 0 4px; color: var(--pq-ink); }
    .gerente-login p.lead { color: var(--pq-muted); margin: 0 0 24px; font-size: 14px; }
    .gerente-login label {
      display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px;
      color: var(--pq-ink);
    }
    .gerente-login input[type="email"],
    .gerente-login input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--pq-line);
      border-radius: 10px;
      font-size: 15px;
      /* Sem estes dois o campo caia no padrao do navegador — que segue o tema
         do SISTEMA, e nao o da pagina. */
      background: var(--pq-panel);
      color: var(--pq-ink);
    }
    .gerente-login input[type="email"]:focus,
    .gerente-login input[type="password"]:focus {
      outline: none;
      border-color: var(--pq-brand);
    }
    .gerente-login .btn { margin-top: 22px; width: 100%; }
    .gerente-login .error { color: var(--pq-danger); font-size: 13px; margin-top: 12px; min-height: 18px; }
    .gerente-login .hint {
      margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--pq-line);
      font-size: 12px; color: var(--pq-muted);
    }
  </style>
  <!-- TEMA ANTES DA PRIMEIRA PINTURA.

       `app.js` e `type="module"`, entao roda DEPOIS de o HTML ser lido: a
       pagina pintava sem atributo de tema — que o CSS trata como escuro, o
       padrao do painel — e so entao o JS aplicava o claro. Dava o flash preto
       a cada F5 para quem escolheu claro.

       Bloqueante e inline de proposito: qualquer coisa assincrona aqui volta a
       pintar antes. Le direto do localStorage porque `storage.js` e modulo, e
       importar um modulo teria o mesmo atraso que se esta corrigindo.

       O `try` cobre navegador com armazenamento bloqueado: sem tema aplicado a
       pagina abre escura, que e o padrao — nunca sem estilo. -->
  <script src="./config/app.config.js"></script>
  <script>
    (function () {
      try {
        var p = (window.__PQ_CONFIG__ && window.__PQ_CONFIG__.STORAGE_PREFIX) || 'pqg';
        if (JSON.parse(localStorage.getItem(p + ':tema')) === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="gerente-login">
  <!-- Decorativa: alt vazio e aria-hidden. Quem usa leitor de tela nao ganha
       nada ouvindo a descricao da cena, e o titulo do cartao ja diz onde a
       pessoa esta. width/height evitam o pulo de layout enquanto ela carrega. -->
  <div class="gerente-login__art" aria-hidden="true">
    <img src="./assets/images/login-hero.webp" alt="" width="1280" height="720">
  </div>

  <main class="gerente-login__card">
    <div class="gerente-login__logo">Q</div>
    <h1>Painel da arena</h1>
    <p class="lead">Entre para gerenciar reservas, quadras e financeiro.</p>

    <form data-login-form novalidate>
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required minlength="6">
      <button type="submit" class="btn btn-primary">Entrar</button>
      <div class="error" data-login-error></div>
    </form>

    <p class="hint">Demo: dono@arenabolanarede.com.br · qadras123</p>
  </main>
  <script type="module" src="./assets/js/login.js"></script>
</body>
</html>
