<!DOCTYPE html>
<!-- data-manager-app: as regras do manager-app.css vivem sob esse seletor.
     Sem o atributo, a folha carrega e nao pinta nada. -->
<html lang="pt-br" data-page="dashboard" data-manager-app data-manager-view="dashboard" data-auth-required="true">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dashboard - Qadras</title>
  <meta name="theme-color" content="#9bcf33">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/desktop.css">
  <link rel="stylesheet" href="./assets/css/manager-app.css">
  <link rel="stylesheet" href="./assets/css/tema.css">
  <link rel="stylesheet" href="./assets/css/sistema.css">
  <script src="./assets/vendor/lucide/lucide.min.js" defer></script>
  <!-- TEMA ANTES DA PRIMEIRA PINTURA.

       `app.js` e `type="module"`, entao roda DEPOIS de o HTML ser lido: a
       pagina pintava sem atributo de tema — que o CSS trata como escuro, o
       padrao do painel — e so entao o JS aplicava o claro. Dava o flash preto
       a cada F5 para quem escolheu claro.

       Bloqueante e inline de proposito: qualquer coisa assincrona aqui volta a
       pintar antes. Le direto do localStorage porque `storage.js` e modulo, e
       importar um modulo teria o mesmo atraso que se esta corrigindo.

       O `try` cobre navegador com armazenamento bloqueado: sem tema aplicado a
       pagina abre escura, que e o padrao — nunca sem estilo. -->
  <script src="./config/app.config.js"></script>
  <script>
    (function () {
      try {
        var p = (window.__PQ_CONFIG__ && window.__PQ_CONFIG__.STORAGE_PREFIX) || 'pqg';
        if (JSON.parse(localStorage.getItem(p + ':tema')) === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- TELA DE CARREGAMENTO — inline, e nao um data-component.

       Ela precisa estar pintada no primeiro frame. Um componente so entra
       depois que `loadComponents()` roda, que e exatamente o tempo que esta
       tela existe para cobrir: sidebar, header e a rota do painel chegam por
       fetch, e ate chegarem a pagina e um retangulo vazio.

       Sai em assets/js/app.js, quando o roteador termina de montar a primeira
       tela. -->
  <div class="loader" data-loader aria-live="polite" aria-busy="true">
    <div class="loader__marca" aria-hidden="true"></div>
    <span class="loader__texto">Carregando o painel</span>
  </div>

  <div class="app" id="app">
    <div class="sb-backdrop" data-nav-close></div>
    <div data-component="./components/sidebar/manager-sidebar.html"></div>
    <div class="main">
      <div data-component="./components/header/app-topbar.html"></div>
      <div class="content">
        <main data-desktop-route-view>
          <div data-component="./pages/dashboard.html"></div>
        </main>
      </div>
      <div data-component="./components/navbar/manager-tabbar.html"></div>
    </div>
  </div>
  <div data-component="./components/modal/manager-menu-sheet.html"></div>
  <div data-component="./components/modal/manager-notif-sheet.html"></div>
  <div data-component="./components/toast/toast.html"></div>
  <script src="./assets/js/ui.js" defer></script>
  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
