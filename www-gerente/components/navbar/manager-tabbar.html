<!-- Navegação do gerente no celular.

     O CSS desta barra existia desde a refatoração — 72 regras prontas, e o
     .content já reservava o espaço embaixo para ela — mas o componente nunca
     foi construído. Somado a isso, manager-app.css escondia o hambúrguer que
     abre a gaveta, e o resultado é que abaixo de 820px o gerente entrava numa
     rota e não tinha como sair dela.

     Cinco destinos, os mesmos data-nav-page da sidebar, para markActiveNav
     acender os dois de uma vez. O quinto abre a gaveta com o resto. -->
<nav class="manager-tabbar" aria-label="Navegação do painel">
  <a data-nav-page="dashboard" href="./dashboard.html">
    <span class="manager-tabbar-icon"><i class="ic" data-lucide="layout-dashboard"></i></span>
    <span>Início</span>
  </a>
  <a data-nav-page="agenda" href="./dashboard.html#agenda">
    <span class="manager-tabbar-icon"><i class="ic" data-lucide="calendar-days"></i></span>
    <span>Agenda</span>
  </a>

  <!-- RESERVAS no centro, elevado — igual ao botao do Mapa no app do jogador.

       Ela e a acao principal do painel no celular: e onde o dono aprova, recusa
       e confere o que vem. Ate agora tinha o mesmo peso de Quadras, que ele
       abre uma vez por mes.

       A ordem mudou para isso: em cinco colunas, "centro" e a terceira, entao
       Agenda subiu para a segunda. O dedo alcanca o meio da barra sem esticar,
       e e la que fica o que mais se toca. -->
  <a class="manager-tabbar-fab" data-nav-page="reservas" href="./dashboard.html#reservas">
    <span><i class="ic" data-lucide="clipboard-check"></i></span><em>Reservas</em>
  </a>

  <a data-nav-page="quadras" href="./dashboard.html#quadras">
    <span class="manager-tabbar-icon"><i class="ic" data-lucide="land-plot"></i></span>
    <span>Quadras</span>
  </a>
  <button type="button" data-nav-open aria-label="Abrir menu">
    <span class="manager-tabbar-icon"><i class="ic" data-lucide="menu"></i></span>
    <span>Menu</span>
  </button>
</nav>
