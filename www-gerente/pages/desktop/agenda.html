<!-- Agenda — restaurada do app antigo (_legacy/.../g_agenda.html).

     A refatoracao tinha deixado uma grade escrita na mao, com quatro nomes
     inventados e sem filtro de quadra, navegacao de semana, lista por dia no
     mobile ou detalhe do agendamento. Tudo isso volta aqui, preenchido por
     assets/js/manager-agenda.js a partir das reservas da arena. -->
<!-- CABECALHO DA AGENDA.

     Era um cartao verde alto com "agosto 2026" em 24px como titulo — e o mes
     nao e o que se olha aqui. A grade abaixo mostra UMA SEMANA; o mes sozinho
     nao diz qual delas, e a informacao que dizia ("17 a 23 de agosto") estava
     em 13px do outro lado da tela, dentro do controle de navegacao.

     Inverti: a SEMANA e o titulo, o mes vira a etiqueta acima. E as tres
     metricas viram pastilhas com o numero em destaque, no lugar de tres pares
     de texto solto separados por um filete. -->
<section class="manager-agenda-command">
  <div class="manager-agenda-title">
    <div>
      <span data-agenda-month>Agenda da arena</span>
      <h2 data-agenda-range>Semana atual</h2>
    </div>
    <div class="cal-range">
      <button class="cal-nav" type="button" data-agenda-week="-1" aria-label="Semana anterior"><i class="ic sm" data-lucide="chevron-left"></i></button>
      <button class="cal-nav cal-nav--hoje" type="button" data-agenda-hoje>Hoje</button>
      <button class="cal-nav" type="button" data-agenda-week="1" aria-label="Próxima semana"><i class="ic sm" data-lucide="chevron-right"></i></button>
    </div>
  </div>
  <!-- OS TRES NUMEROS SAIRAM.

       "Reservas", "Para aprovar" e "Previsto" ja estao no Dashboard, que e a
       tela de resumo. Aqui a pergunta e outra e e visual: onde tem buraco na
       semana. A propria grade responde — contar os blocos e ler o total dao a
       mesma coisa, e o cabecalho com tres cartoes empurrava o calendario para
       baixo justamente na tela em que a altura e o que falta.

       Agenda simples: a semana, a navegacao e a grade. -->
</section>

<section class="manager-agenda-workspace">
<div class="cal-toolbar">
  <div class="manager-agenda-court-filter" data-seg data-agenda-courts aria-label="Filtrar quadra"></div>
  <div class="cal-legend">
    <span><i class="pago"></i> Pago</span>
    <span><i class="confirmado"></i> Confirmado</span>
    <span><i class="pendente"></i> Aguardando</span>
    <!-- Terceiro estado: sem ele a hachura aparece na grade sem nada que a
         explique, e o dono fica adivinhando o que aquilo quer dizer. -->
    <span><i class="fechado"></i> Fechado</span>
  </div>
</div>

<!-- Uma reserva por linha, dia a dia. No desktop a grade abaixo assume. -->
<div class="manager-agenda-mobile" data-agenda-mobile></div>

<div class="manager-agenda-desktop">
  <div class="cal">
    <div class="cal-head" data-agenda-head></div>
    <div class="cal-body" data-agenda-body></div>
  </div>
</div>
</section>
<div class="modal" data-agenda-event-modal hidden>
  <div class="modal-backdrop" data-agenda-event-close></div>
  <div class="modal-box ev-modal">
    <div class="modal-head">
      <h3>Detalhes do agendamento</h3>
      <button class="modal-x" type="button" data-agenda-event-close aria-label="Fechar"><i class="ic" data-lucide="x"></i></button>
    </div>
    <div class="modal-body">
      <div class="ev-person">
        <span class="ev-avatar" data-ev-ini>?</span>
        <div class="ev-person-info">
          <strong data-ev-cli>—</strong>
          <span class="ev-phone"><i class="ic sm" data-lucide="phone"></i> <span data-ev-tel>—</span></span>
        </div>
        <span class="status" data-ev-status>—</span>
      </div>

      <div class="ev-rows">
        <div class="ev-row"><span class="k"><i class="ic" data-lucide="layout-grid"></i> Quadra</span><span class="v" data-ev-quadra>—</span></div>
        <div class="ev-row"><span class="k"><i class="ic" data-lucide="calendar"></i> Dia</span><span class="v" data-ev-dia>—</span></div>
        <div class="ev-row"><span class="k"><i class="ic" data-lucide="clock"></i> Horário</span><span class="v num" data-ev-hora>—</span></div>
        <div class="ev-row"><span class="k"><i class="ic" data-lucide="clock"></i> Duração</span><span class="v" data-ev-dur>—</span></div>
        <div class="ev-row"><span class="k"><i class="ic" data-lucide="dollar-sign"></i> Valor</span><span class="v num" data-ev-valor>—</span></div>
        <div class="ev-row"><span class="k"><i class="ic" data-lucide="hash"></i> Código</span><span class="v num" data-ev-codigo>—</span></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-soft" type="button" data-agenda-event-close>Fechar</button>
      <a class="btn btn-primary" href="./dashboard.html#mensagens"><i class="ic sm" data-lucide="message-circle"></i> Falar com o cliente</a>
    </div>
  </div>
</div>
