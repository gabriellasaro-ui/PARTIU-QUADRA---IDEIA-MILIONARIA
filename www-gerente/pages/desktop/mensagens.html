<!-- Mensagens — conversas REAIS da arena.

     A tela era HTML estatico: tres conversas escritas a mao ("Matheus Rocha",
     "Carol Souza", "Rafael Mendes"), um dialogo inventado, e um botao de
     enviar que nao enviava para lugar nenhum. Montada agora por
     assets/js/manager-messages.js a partir de /api/mensagens.

     O BOTAO DE LIGAR foi removido e nao volta. Ele expunha o telefone do
     jogador com um clique e tirava a conversa da plataforma: sem registro do
     que foi combinado, e e por ali que a proxima reserva passa a ser fechada
     por fora — sem horario travado, sem pagamento, com a agenda dos dois lados
     quebrada. (Ele nem ligava, alias: mostrava um toast dizendo "preparada
     para a API".) -->
<div class="chat">
  <aside class="chat-list">
    <div class="chat-list-head">
      <span>Conversas</span>
    </div>
    <div data-conv-list></div>
  </aside>

  <section class="chat-thread" data-conv-thread hidden>
    <div class="thread-head">
      <span class="conv-av" data-conv-ini>?</span>
      <div>
        <strong data-conv-nome>—</strong>
        <div class="thread-sub" data-conv-sub></div>
      </div>

      <!-- ENCERRAR e a UNICA acao sobre um atendimento.

           "Bloquear pessoa" saiu por decisao do Gabriel: nao existe banir
           cliente no produto. E coerente — a arena vive de quem reserva, e um
           banimento permanente decidido num botao, sem recurso e sem quem
           revise, e poder demais para um painel de agendamento.

           Encerrar resolve o que precisava ser resolvido: o canal existe para
           combinar AQUELE jogo — chegada, atraso, acesso — e nao para virar
           linha direta permanente por onde a proxima reserva e fechada por
           fora, sem horario travado e sem pagamento. -->
      <button class="btn btn-soft th-act" type="button" data-conv-encerrar hidden>
        <i class="ic sm" data-lucide="check"></i> Encerrar atendimento
      </button>
    </div>

    <!-- O JOGO DE QUE A CONVERSA TRATA.

         O cabecalho dizia so "Reserva PQ-40751". Quando o cliente pergunta
         "posso chegar 21h15?", o dono precisava sair da tela, abrir Reservas e
         procurar o codigo para saber de que horario se tratava. Agora quadra,
         dia, hora e valor ficam na propria conversa — e de quebra a faixa
         ocupa o vao morto entre o cabecalho e as bolhas. -->
    <div class="thread-reserva" data-conv-reserva hidden>
      <span><i class="ic sm" data-lucide="layout-grid"></i><b data-conv-quadra></b></span>
      <span><i class="ic sm" data-lucide="calendar"></i><b data-conv-dia></b></span>
      <span><i class="ic sm" data-lucide="clock"></i><b data-conv-hora></b></span>
      <span><i class="ic sm" data-lucide="wallet"></i><b data-conv-valor></b></span>
      <span class="status" data-conv-status></span>
    </div>

    <div class="bubbles" data-conv-msgs></div>

    <div class="composer" data-conv-composer hidden>
      <input type="text" placeholder="Escrever mensagem" data-conv-texto>
      <button class="btn btn-primary" type="button" data-conv-enviar>
        <i class="ic sm" data-lucide="send"></i> Enviar
      </button>
    </div>

    <!-- Encerrada, a conversa nao aceita mensagem: deixar o campo ali seria
         oferecer uma acao que o servidor recusa. -->
    <div class="conv-encerrada-aviso" data-conv-encerrada-aviso hidden>
      <i class="ic sm" data-lucide="check"></i>
      Atendimento encerrado. O histórico fica guardado, mas ninguém escreve mais aqui.
    </div>
  </section>

  <div class="conv-vazio" data-conv-empty hidden>
    <strong>Nenhuma conversa aberta</strong>
    <span>O canal com o cliente abre sozinho quando uma reserva é paga.</span>
  </div>
</div>
