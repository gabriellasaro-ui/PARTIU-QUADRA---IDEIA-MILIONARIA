<!-- Minhas quadras — os espacos da arena do gerente.

     Restaura as duas metades do app antigo: a Vitrine (como a arena aparece
     no Explorar) e o catalogo de espacos. A versao refatorada tinha perdido
     a Vitrine inteira e listava as arenas do marketplace no lugar das
     quadras da casa. Preenchido por assets/js/manager-courts.js. -->
<section class="manager-showcase" id="vitrine">
  <div class="manager-showcase__copy">
    <span class="manager-eyebrow"><i></i> Vitrine no Explorar</span>
    <h2>Sua arena pronta para ser encontrada</h2>
    <p>Controle a visibilidade e o destaque das suas quadras sem sair da gestão.</p>

  </div>
  <div class="manager-showcase__stats" aria-label="Indicadores da vitrine">
      <!-- "1.284 visualizacoes em 30 dias" e "9,8% de conversao" eram duas
           constantes escritas a mao. O rotulo mudou junto com a origem: a
           tabela de procura guarda acumulado por horario, sem data — dizer "30
           dias" seria trocar uma invencao por outra menor. -->
      <div><strong class="num" data-showcase-views>0</strong><small>horários procurados</small></div>
      <div><strong class="num" data-showcase-conversion>—</strong><small>viraram reserva</small></div>
  </div>

  <div class="manager-showcase__settings">
      <button type="button" class="manager-setting-toggle" data-showcase-setting="visible" aria-pressed="false">
        <span><svg class="ic"><use href="#i-map"/></svg></span>
        <div><strong>Visível no Explorar</strong><small>Jogadores podem encontrar sua arena</small></div>
        <i></i>
      </button>
  </div>

  <!-- Turbinar e recurso pago: vira card com preco e prazo, nao um
        interruptor solto. O efeito e real — a arena turbinada sobe no
        Explorar do jogador. A cobranca entra quando houver adquirente. -->
  <!-- DESTAQUE REGIONAL: removido por enquanto.

       O botao dizia "Turbinar · R$ 79/30 dias" e gravava a compra no
       localStorage do proprio navegador. Nenhum backend, nenhuma cobranca,
       nenhum efeito na busca do jogador — o dono clicava achando que tinha
       contratado destaque, via o selo "Turbinada ate 21/09" e nao acontecia
       absolutamente nada.

       Mock de tela e uma coisa; mock que simula COMPRA e outra. A ideia do
       produto e boa e o lugar dela e este — volta quando existir a rota, o
       adquirente e o efeito real na ordenacao do Explorar. -->
</section>

<div class="manager-section__head manager-courts-head">
  <div>
    <span>Catálogo</span>
    <h2>Espaços cadastrados</h2>
    <small class="panel-sub" data-court-count></small>
  </div>
  <a class="btn btn-primary" href="./dashboard.html#quadra">
    <svg class="ic sm"><use href="#i-plus"/></svg> Adicionar quadra
  </a>
</div>

<div class="grid" data-court-list></div>
