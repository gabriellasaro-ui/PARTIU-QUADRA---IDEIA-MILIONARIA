<!-- Nova reserva — porte de _legacy/.../g_reserva_nova.html.

     Tela inteira que nunca tinha sido portada: e como o gerente agenda para
     quem fechou por telefone ou apareceu na porta. Sem ela a arena so
     conseguia registrar o que viesse pelo app. -->
<a href="./dashboard.html#reservas" class="back-link"><i class="ic sm" data-lucide="chevron-left"></i> Voltar para reservas</a>

<form id="reserva-form" class="settings" data-booking-form>

  <section class="set-card">
    <div class="set-aside">
      <h2>Cliente</h2>
      <p>Quem vai jogar. O contato é usado para avisos da reserva.</p>
    </div>
    <div class="set-fields">
      <div class="inp"><label>Nome do cliente</label><input type="text" name="cliente" placeholder="Ex.: Lucas Andrade" required></div>
      <div class="input-row" style="margin-bottom:0;">
        <div class="inp" style="margin-bottom:0;"><label>Telefone / WhatsApp</label><input type="text" name="telefone" placeholder="(62) 90000-0000" required></div>
        <div class="inp" style="margin-bottom:0;"><label>E-mail (opcional)</label><input type="text" name="email" placeholder="cliente@email.com"></div>
      </div>
    </div>
  </section>

  <section class="set-card">
    <div class="set-aside">
      <h2>Reserva</h2>
      <p>Quadra, dia e horário do jogo.</p>
    </div>
    <div class="set-fields">
      <div class="input-row">
        <div class="inp"><label for="rn-quadra">Quadra</label><select id="rn-quadra" name="quadra" data-booking-courts></select></div>
        <!-- DATA EM CALENDARIO, e nao texto livre.

             O campo era `type="text"` com "Hoje" escrito dentro. Duas coisas
             quebravam: nao havia como marcar para a proxima terca sem digitar
             algo que o servidor teria de adivinhar, e a lista de horarios
             abaixo era fixa de 6h as 23h — mostrava horario que a quadra nao
             abre e horario JA RESERVADO, entao o dono marcava por telefone em
             cima de um jogo existente e so descobria no dia.

             Agora a data e um calendario e os horarios saem de
             /api/quadras/{id}/horarios?data=..., a MESMA rota que o app do
             jogador usa. Os dois passam a ver a mesma disponibilidade. -->
        <div class="inp"><label for="rn-data">Data</label><input id="rn-data" type="date" name="data" data-booking-data required></div>
      </div>
      <div class="input-row" style="margin-bottom:0;">
        <div class="inp" style="margin-bottom:0;"><label for="rn-inicio">Início</label><select id="rn-inicio" name="inicio" data-booking-hours></select>
          <small class="inp__aviso" data-booking-aviso hidden></small>
        </div>
        <div class="inp" style="margin-bottom:0;"><label>Duração</label><select name="duracao">
          <option value="1">1 hora</option><option value="1.5">1h30</option><option value="2">2 horas</option>
        </select></div>
      </div>
    </div>
  </section>

  <section class="set-card">
    <div class="set-aside">
      <h2>Pagamento</h2>
      <p>Como essa reserva será cobrada.</p>
    </div>
    <div class="set-fields">
      <div class="input-row">
        <div class="inp"><label>Valor (R$)</label><input type="number" name="valor" value="120" min="0" step="10" required></div>
        <div class="inp"><label>Status</label><select name="status">
          <option>Pago</option><option>Pendente</option><option>Confirmado</option>
        </select></div>
      </div>
      <div class="set-hint"><i class="ic" data-lucide="shield"></i> Reservas manuais entram na sua agenda e no faturamento normalmente.</div>
    </div>
  </section>

  <!-- A barra so aparece quando ha o que salvar: sendo sticky, ela flutuava
       sobre o formulario e cobria a linha que estivesse embaixo dela — no
       cadastro de quadra escondia um dia inteiro do expediente. -->
  <div class="manager-form-actions" data-form-actions hidden>
    <span class="form-actions__aviso">Reserva não criada</span>
    <a href="./dashboard.html#reservas" class="btn btn-soft">Cancelar</a>
    <button type="submit" class="btn btn-primary"><i class="ic sm" data-lucide="check"></i> Criar reserva</button>
  </div>
</form>
