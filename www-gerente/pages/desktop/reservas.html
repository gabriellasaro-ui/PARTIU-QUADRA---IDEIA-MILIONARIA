<!-- RESERVAS — a tela onde o dono aceita ou recusa.

     Refeita em torno de uma pergunta: "o que precisa de mim AGORA?". Tudo o
     mais na tela e consulta, e consulta pode esperar.

     SO AVULSAS. Mensalista tem tela propria no menu.

     Ele ja passou por tres formas aqui: secao no rodape desta pagina, depois
     aba ao lado de "Avulsas", e agora nenhuma. As duas primeiras erravam pela
     mesma razao — sao operacoes diferentes e nao competem pela mesma atencao.
     A avulsa e decisao PONTUAL com prazo: aprova ou recusa em 15 minutos,
     senao expira. O mensalista e compromisso recorrente que ja esta na grade,
     e o dono olha para acompanhar, nao para decidir.

     A aba ainda deixava o painel com dois lugares para a mesma coisa, e o
     daqui era o incompleto: mostrava a lista sem a receita recorrente nem os
     horarios travados no mes, que sao o motivo de olhar para mensalista.
-->
<div class="toolbar">
  <div class="field grow">
    <i class="ic" data-lucide="search"></i>
    <input type="text" placeholder="Buscar por cliente, código ou quadra" data-booking-search>
  </div>
  <!-- "Nova reserva" saiu daqui: ela virou acao fixa do header, alcancavel de
       qualquer tela. Dois botoes iguais na mesma pagina, um a 40px do outro,
       so fazem o dono parar para descobrir se sao a mesma coisa. -->
</div>

<!-- O banner some quando nao ha o que responder: aviso permanente vira
     decoracao e para de ser lido. -->
<a class="req-banner" href="#solicitacoes" data-booking-banner hidden>
  <span class="ico"><i class="ic" data-lucide="bell"></i></span>
  <div><b data-booking-banner-count></b><small>Aprove ou recuse antes que o prazo termine.</small></div>
  <i class="ic sm" data-lucide="chevron-right"></i>
</a>

<!-- BARRA DE CONTROLE: escopo, periodo e status na mesma linha.

     Antes o escopo era um par de pilulas verdes grandes soltas no meio da
     tela, e o periodo simplesmente NAO EXISTIA — a API aceitava `de`/`ate`
     desde a fase 2 e nenhuma tela oferecia os campos.

     Os tres controles pertencem juntos porque respondem a mesma pergunta:
     "que recorte da agenda eu quero ver agora?". Separados, o dono mudava um e
     procurava os outros. -->
<div class="filtro-barra">
  <!-- AS ABAS "Avulsas / Mensalistas" SAIRAM.

       Mensalista tem tela propria no menu, com resumo de receita recorrente e
       os cartoes de plano. Duplicar aqui dava dois lugares para a mesma coisa,
       e nenhum dos dois completo: esta aba mostrava so a lista, sem os numeros
       da outra tela.

       Reservas passa a ser o que o nome diz — a fila de reservas avulsas, que
       e onde o dono aprova e recusa. -->

  <div class="filtro-periodo" data-scope-only="avulso">
    <!-- ATALHOS + INTERVALO PROPRIO. Os atalhos servem ao dia a dia; quem
         fecha o mes precisa de "1 a 31 de julho", e nao de "ultimos 30 dias a
         partir de agora". -->
    <div class="chips-periodo">
      <button type="button" class="on" data-periodo="">Tudo</button>
      <button type="button" data-periodo="7">Próximos 7 dias</button>
      <button type="button" data-periodo="30">Próximos 30 dias</button>
    </div>
    <div class="campo-data">
      <label for="res-de">De</label>
      <input type="date" id="res-de" data-booking-de>
      <label for="res-ate">até</label>
      <input type="date" id="res-ate" data-booking-ate>
      <button type="button" class="btn-limpar" data-periodo-limpar hidden aria-label="Limpar período">
        <i class="ic sm" data-lucide="x"></i>
      </button>
    </div>
  </div>
</div>

<!-- ══════════════════════════ AVULSAS ══════════════════════════ -->
<div data-scope-panel="avulso">
  <section class="manager-reservation-overview" aria-label="Resumo das reservas">
    <article><span><i class="ic" data-lucide="calendar"></i></span><div><strong class="num" data-booking-total>0</strong><small>Reservas no período</small></div></article>
    <article><span><i class="ic" data-lucide="wallet"></i></span><div><strong class="num" data-booking-volume>R$ 0,00</strong><small>Valor movimentado</small></div></article>
    <article data-booking-pending-card><span><i class="ic" data-lucide="clock"></i></span><div><strong class="num" data-booking-pending>0</strong><small>Aguardando aprovação</small></div></article>
  </section>

  <section class="manager-section" id="solicitacoes">
    <div class="manager-section__head manager-section__head--stack">
      <!-- "Reservas avulsas" virou "Reservas": a fila passou a incluir tambem as
           solicitacoes de mensalista, que antes nao apareciam em lugar nenhum
           onde o dono pudesse decidir. -->
      <div><span>Operação</span><h2>Reservas</h2></div>
      <div class="tabs manager-filter-tabs" data-seg>
        <button type="button" class="on" data-booking-filter="">Todas</button>
        <button type="button" data-booking-filter="solicitada">Solicitações</button>
        <button type="button" data-booking-filter="pago">Pagas</button>
        <button type="button" data-booking-filter="pendente">Pendentes</button>
        <button type="button" data-booking-filter="confirmado">Confirmadas</button>
      </div>
    </div>

    <!-- CABECALHO DA LISTA.

         Cada linha repetia "Quadra", "Data e horário" e "Valor" em 9.5px
         acima do proprio valor — dezoito vezes na mesma tela. Isso e um
         cabecalho de tabela impresso em cada linha: triplica o texto, some com
         a hierarquia (rotulo e dado quase do mesmo tamanho) e ainda assim se
         le pior, porque a coluna nao tem titulo, tem dezoito titulos.

         Ele aparece uma vez, e some abaixo de 900px — ali as colunas viram
         empilhadas e cada valor precisa mesmo dizer o que e. -->
    <div class="manager-booking-head" aria-hidden="true">
      <span>Cliente</span>
      <span>Quadra</span>
      <span>Data e horário</span>
      <span>Valor</span>
      <span>Status</span>
      <span></span>
    </div>

    <div class="manager-bookings" data-manager-reservation-list></div>

    <div class="manager-empty-list" data-booking-empty hidden>
      <i class="ic" data-lucide="calendar"></i>
      <strong>Nenhuma reserva neste filtro</strong>
      <span>Escolha outro status para continuar.</span>
    </div>

    <!-- PAGINACAO.

         A lista vinha cortada em 200 linhas sem dizer que havia corte: a tela
         mostrava o que coubesse e o dono nao tinha como saber que faltava.
         Aqui o total aparece em texto, e nao so as setas — "1-20 de 148" e o
         que responde "ja vi tudo?". -->
    <!-- O RODAPE aparece SEMPRE que ha reserva, mesmo com uma pagina so.

         Antes ele sumia quando tudo cabia numa pagina — e sumia junto o TOTAL,
         que e a informacao que responde "ja vi tudo?". O dono ficava sem saber
         se estava vendo 18 de 18 ou 18 de 200. As setas e que ficam
         desabilitadas quando nao ha para onde ir. -->
    <nav class="pager" data-booking-pager hidden aria-label="Páginas de reservas">
      <span class="pager__info" data-pager-info></span>
      <span class="pager__nav">
        <button type="button" class="btn btn-soft btn-xs" data-pager-prev>
          <i class="ic sm" data-lucide="chevron-left"></i> Anterior
        </button>
        <button type="button" class="btn btn-soft btn-xs" data-pager-next>
          Próxima <i class="ic sm" data-lucide="chevron-right"></i>
        </button>
      </span>
    </nav>
  </section>
</div>
