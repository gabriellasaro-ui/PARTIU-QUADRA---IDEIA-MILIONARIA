<!-- Avaliações — porte de _legacy/.../g_avaliacoes.html.

     Estava com tres KPIs inventados e dois reviews escritos na mao (Matheus
     Rocha, Carol Souza — clientes que nao existem no sistema). Voltam a nota
     media com estrelas, a distribuicao por nota e a lista com caixa de
     resposta, montadas por assets/js/manager-reviews.js. -->
<div class="split-2">
  <div class="card">
    <h2>Reputação</h2>
    <div class="rating-big">
      <div class="rb-num num" data-reviews-average>0,0</div>
      <div>
        <div class="rb-stars" data-reviews-stars></div>
        <div class="rb-total"><span data-reviews-total>0</span> avaliações</div>
      </div>
    </div>
    <div class="dist" data-reviews-dist></div>

    <!-- NOTA POR QUADRA.

         A media da arena junta tudo: com quatro quadras, a que esta com o piso
         ruim dilui nas outras tres e o dono nunca descobre ONDE esta o
         problema — ve 4,8 e conclui que esta tudo bem.

         Ordenadas da PIOR para a melhor, porque a lista existe para ele agir.
         Clicar filtra a lista ao lado. -->
    <div class="rev-quadras" data-reviews-courts></div>
  </div>

  <div data-reviews-list></div>
</div>
