<!DOCTYPE html>
<html lang="pt-br" data-manager-app>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Qadras Gerente</title>
  <meta name="theme-color" content="#1b7a3e">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">
  <link rel="stylesheet" href="./assets/css/desktop.css">
  <link rel="stylesheet" href="./assets/css/manager-app.css">
  <link rel="stylesheet" href="./assets/css/tema.css">
  <link rel="stylesheet" href="./assets/css/sistema.css">
  <script src="./assets/vendor/lucide/lucide.min.js" defer></script>
  <style>
    /* Tela de passagem: existe por menos de um piscar. Só o suficiente para
       não haver um retângulo branco entre abrir o app e a primeira tela. */
    .entrada {
      display: grid;
      min-height: 100vh;
      place-items: center;
      background: var(--pq-app-bg, #0e1613);
      color: var(--pq-ink, #e8f2ec);
      font-family: 'Inter', system-ui, sans-serif;
      gap: 14px;
      text-align: center;
    }

    .entrada__marca {
      display: grid;
      width: 62px;
      height: 62px;
      place-items: center;
      border-radius: 18px;
      background: var(--pq-brand, #16a765);
      color: #fff;
      font-size: 30px;
      font-weight: 800;
    }

    .entrada__txt {
      color: var(--pq-muted, #8ba396);
      font-size: 13px;
    }
  </style>
  <!-- TEMA ANTES DA PRIMEIRA PINTURA.

       `app.js` e `type="module"`, entao roda DEPOIS de o HTML ser lido: a
       pagina pintava sem atributo de tema — que o CSS trata como escuro, o
       padrao do painel — e so entao o JS aplicava o claro. Dava o flash preto
       a cada F5 para quem escolheu claro.

       Bloqueante e inline de proposito: qualquer coisa assincrona aqui volta a
       pintar antes. Le direto do localStorage porque `storage.js` e modulo, e
       importar um modulo teria o mesmo atraso que se esta corrigindo.

       O `try` cobre navegador com armazenamento bloqueado: sem tema aplicado a
       pagina abre escura, que e o padrao — nunca sem estilo. -->
  <script src="./config/app.config.js"></script>
  <script>
    (function () {
      try {
        var p = (window.__PQ_CONFIG__ && window.__PQ_CONFIG__.STORAGE_PREFIX) || 'pqg';
        if (JSON.parse(localStorage.getItem(p + ':tema')) === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!--
    PONTO DE ENTRADA DO APK DO GERENTE.

    O Capacitor exige um index.html no webDir — é o que ele abre quando o app
    abre. Este painel nasceu para a web, onde a pessoa digita /login.html ou
    /dashboard.html; no app não há barra de endereço, e sem este arquivo o
    `cap add` recusava o projeto inteiro.

    Ele não é uma tela: decide para onde ir e sai da frente. Com sessão
    guardada vai ao painel, sem sessão vai ao login — a mesma regra que
    dashboard.html e login.html já aplicam entre si, só que aplicada uma vez
    na abertura em vez de num redirecionamento em cadeia.

    `location.replace` e não `assign`: esta tela não pode entrar no histórico,
    senão o botão voltar do Android cairia aqui e ricochetearia de volta.
  -->
  <main class="entrada">
    <span class="entrada__marca">Q</span>
    <span class="entrada__txt">Abrindo o painel…</span>
  </main>

  <script type="module">
    import storage from './storage/storage.js';
    import { aplicarTema } from './services/tema.js';

    // O tema entra ANTES do redirect: esta tela some rapido, mas sem isto
    // pisca no tema errado a cada abertura do app.
    aplicarTema();

    const destino = storage.getAuthToken() ? './dashboard.html' : './login.html';
    location.replace(destino);
  </script>

  <noscript>
    <p>Este painel precisa de JavaScript. <a href="./login.html">Ir para o login</a>.</p>
  </noscript>
</body>
</html>
