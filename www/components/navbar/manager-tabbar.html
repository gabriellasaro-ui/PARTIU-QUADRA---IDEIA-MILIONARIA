     .content já reservava o espaço embaixo para ela — mas o componente nunca
     foi construído. Somado a isso, manager-app.css escondia o hambúrguer que
     abre a gaveta, e o resultado é que abaixo de 820px o gerente entrava numa
     rota e não tinha como sair dela.

     Cinco destinos, os mesmos data-nav-page da sidebar, para markActiveNav
     acender os dois de uma vez. O quinto abre a gaveta com o resto. -->
