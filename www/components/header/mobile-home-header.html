  <div class="market-nav">
    <button class="location-switch" type="button" data-sheet-open="location-sheet" aria-expanded="false">
      <span class="location-switch__icon"><i class="ic" data-lucide="map-pin"></i></span>
      <span class="location-switch__copy">
        <small>Qadras | jogar em</small>
        <strong data-current-location>Escolher local</strong>
      </span>
      <i class="ic location-switch__chevron" data-lucide="chevron-down"></i>
    </button>

    <button class="market-notification" type="button" data-sheet-open="notifications-sheet" aria-expanded="false" aria-label="Abrir notificações">
      <i class="ic" data-lucide="bell"></i>
      <span data-notification-dot></span>
    </button>
  </div>

  <div class="market-copy">
    <!-- "Gabriel" estava escrito aqui, no HTML. Quem entrasse com outra conta
         continuava sendo cumprimentado pelo nome do usuario de demonstracao.
         O nome agora vem da sessao; ate chegar, fica so a saudacao. -->
    <p><span data-home-greeting>Olá</span><span data-home-name></span></p>
    <h1>Onde vamos jogar hoje?</h1>
  </div>

  <form action="./index.html#quadras" method="get" class="market-search" data-search-form>
    <i class="ic" data-lucide="search"></i>
    <input type="search" name="q" placeholder="Quadra, esporte ou bairro" autocomplete="off">
    <input type="hidden" name="local" value="" data-search-location>
    <button type="submit" aria-label="Buscar">
      <i class="ic" data-lucide="arrow-right"></i>
    </button>
  </form>
