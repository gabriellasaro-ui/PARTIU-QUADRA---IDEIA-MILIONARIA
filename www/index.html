<!DOCTYPE html>
<html lang="pt-br" data-page="home" data-capacitor-app>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Qadras</title>
  <script>
    (function () {
      var desktopMedia = window.matchMedia('(min-width: 900px)');

      function openDesktop() {
        var capacitor = window.Capacitor;
        var nativeApp = Boolean(capacitor && capacitor.isNativePlatform && capacitor.isNativePlatform());
        var forceApp = new URLSearchParams(window.location.search).get('modo') === 'app';
        if (nativeApp || forceApp || !desktopMedia.matches) return;

        var desktopUrl = new URL('./pc.html', window.location.href);
        desktopUrl.search = window.location.search;
        desktopUrl.hash = window.location.hash || '#quadras';
        window.location.replace(desktopUrl.href);
      }

      openDesktop();
      if (desktopMedia.addEventListener) desktopMedia.addEventListener('change', openDesktop);
    })();
  </script>
  <meta name="theme-color" content="#16a765">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/mobile-v2.css">
  <link rel="stylesheet" href="./assets/css/game-mode.css">
</head>
<body>
  <div class="app-wrap">
    <div class="phone">
      <div class="screen">
        <div data-route-header>
          <div data-component="./components/header/mobile-home-header.html"></div>
        </div>
        <main data-route-view data-current-route="home">
          <div data-component="./pages/home.html"></div>
        </main>
      </div>
      <div data-component="./components/navbar/mobile-tabbar.html"></div>
      <div data-component="./components/toast/toast.html"></div>
      <div data-component="./components/modal/mobile-market-sheets.html"></div>
    </div>
  </div>
  <script src="./assets/vendor/lucide/lucide.min.js" defer></script>
  <script src="./assets/vendor/leaflet/leaflet.js" defer></script>
  <script src="./assets/js/ui.js" defer></script>
  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
