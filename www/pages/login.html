<div class="topbar">
  <div class="brand">
    <span class="logo-mark"><svg class="ic"><use href="#i-pin"/></svg></span>
    Qadras
  </div>
  <h1>Entrar na sua conta</h1>
</div>

<div class="container">
  <form class="card" data-login-form>
    <div class="field">
      <label>E-mail</label>
      <input type="email" name="email" autocomplete="email" placeholder="voce@email.com" required>
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" name="password" autocomplete="current-password" placeholder="Sua senha" required>
    </div>
    <button class="btn block" type="submit">Entrar</button>
  </form>
</div>
