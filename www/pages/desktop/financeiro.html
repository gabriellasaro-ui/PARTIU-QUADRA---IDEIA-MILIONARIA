<!-- Financeiro — restaurado do app antigo (_legacy/.../g_financeiro.html).

     Mostra faturamento, nao repasse: a arena ve o que entra em reservas.
     Comissao saiu de toda a tela por decisao do dono.
     Preenchido por assets/js/manager-finance.js. -->
<!-- Duas caixas com os mesmos botoes: o app antigo tinha o seletor do desktop
     no topbar da rota e o do mobile no conteudo. O topbar aqui e um
     componente compartilhado, entao os dois descem para ca — a folha esconde
     um ou outro conforme a largura. -->
<div class="manager-finance-toolbar">
  <div class="period" data-seg aria-label="Período financeiro">
    <button type="button" data-finance-period="hoje">Hoje</button>
    <button type="button" class="on" data-finance-period="7d">7 dias</button>
    <button type="button" data-finance-period="30d">30 dias</button>
  </div>
</div>

<div class="manager-mobile-period" data-seg aria-label="Período financeiro">
  <button type="button" data-finance-period="hoje">Hoje</button>
  <button type="button" class="on" data-finance-period="7d">7 dias</button>
  <button type="button" data-finance-period="30d">30 dias</button>
</div>

<section class="manager-finance-summary">
  <div class="manager-finance-metrics">
    <article><span><svg class="ic"><use href="#i-dollar"/></svg></span><div><small>Faturamento bruto</small><strong class="num" data-finance-gross>R$ 0,00</strong></div></article>
    <article><span><svg class="ic"><use href="#i-calendar"/></svg></span><div><small>Reservas no período</small><strong class="num" data-finance-count>0</strong></div></article>
  </div>
</section>

<section class="manager-panel manager-finance-analytics">
  <div class="manager-finance-chart">
    <div class="manager-panel__head">
      <div><span>Desempenho</span><h2>Faturamento na semana</h2></div>
      <small>Últimos 7 dias</small>
    </div>
    <svg class="lc" viewBox="0 0 620 240" role="img" aria-label="Faturamento por dia" data-finance-chart>
      <defs><linearGradient id="lcfin" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9bcf33" stop-opacity=".22"/><stop offset="1" stop-color="#9bcf33" stop-opacity="0"/>
      </linearGradient></defs>
      <path class="lc-area" data-finance-area d="" fill="url(#lcfin)"/>
      <path class="lc-line" data-finance-line d=""/>
    </svg>
  </div>

  <div class="manager-finance-breakdown">
    <div class="manager-finance-health">
      <div><span>Ticket médio</span><strong class="num" data-finance-ticket>R$ 0,00</strong></div>
      <div><span>Ocupação média</span><strong class="num" data-finance-occ>0%</strong></div>
    </div>
  </div>
</section>

<section class="manager-panel manager-finance-ledger">
  <div class="manager-panel__head">
    <div><span>Receitas</span><h2>Reservas faturadas</h2></div>
    <a href="#" data-csv-table="#tbl-receitas" data-csv-name="receitas-qadras.csv">Exportar CSV</a>
  </div>
  <div class="manager-table-wrap">
    <table class="tbl manager-finance-table" id="tbl-receitas">
      <thead><tr><th>Cliente</th><th>Data</th><th>Bruto</th><th>Status</th></tr></thead>
      <tbody data-finance-ledger></tbody>
    </table>
  </div>
</section>
