<div class="toolbar">
  <div class="field grow">
    <svg class="ic"><use href="#i-search"/></svg>
    <input type="text" placeholder="Buscar quadra">
  </div>
  <div class="field">
    <svg class="ic"><use href="#i-sliders"/></svg>
    <select>
      <option>Todas</option>
      <option>Ativas</option>
      <option>Pausadas</option>
    </select>
  </div>
</div>

<!-- Grade montada por assets/js/manager-venues.js a partir de venueService.
     Antes eram tres cards escritos na mao, com preco em texto fixo. -->
<div class="grid" data-manager-venue-list></div>

<div class="modal" data-manager-venue-dialog hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h3>Precos de <span data-venue-dialog-name></span></h3>
      <button class="btn btn-soft" type="button" data-manager-venue-cancel aria-label="Fechar">Fechar</button>
    </div>
    <form data-manager-venue-form>
      <input type="hidden" name="id">
      <label class="field-block">
        <span>Avulso (por hora)</span>
        <input type="number" name="price" min="0" step="5" required>
      </label>
      <label class="field-block">
        <span>Mensalista (por mes, 4 sessoes)</span>
        <input type="number" name="priceMonthly" min="0" step="5" required>
        <small>Deixe abaixo de 4x o avulso para o plano compensar para o jogador.</small>
      </label>
      <div class="modal-actions">
        <button class="btn btn-soft" type="button" data-manager-venue-cancel>Cancelar</button>
        <button class="btn" type="submit">Salvar precos</button>
      </div>
    </form>
  </div>
</div>
