<!-- Detalhes da reserva — porte de _legacy/.../g_reserva_detalhe.html.

     Tela inteira que nunca tinha sido portada. E onde o gerente aprova,
     recusa, confirma pagamento e cancela — as quatro rotas POST do app
     antigo (/reservas/<id>/aprovar|recusar|pagar|cancelar). Preenchida por
     assets/js/manager-booking-detail.js. -->
<a href="./dashboard.html#reservas" class="back-link"><svg class="ic sm"><use href="#i-left"/></svg> Voltar para reservas</a>

<div class="split-2" data-booking-detail>
  <div>
    <div class="card">
      <h2>Reserva</h2>
      <div class="bc-fields" style="margin-top:0;">
        <div class="bc-field"><span class="k"><svg class="ic"><use href="#i-grid"/></svg> Quadra</span><span class="v" data-bd-quadra>—</span></div>
        <div class="bc-field"><span class="k"><svg class="ic"><use href="#i-calendar"/></svg> Data</span><span class="v" data-bd-data>—</span></div>
        <div class="bc-field"><span class="k"><svg class="ic"><use href="#i-clock"/></svg> Horário</span><span class="v num" data-bd-hora>—</span></div>
        <div class="bc-field"><span class="k"><svg class="ic"><use href="#i-hash"/></svg> Código</span><span class="v num" data-bd-codigo>—</span></div>
        <div class="bc-field"><span class="k"><svg class="ic"><use href="#i-check"/></svg> Status</span><span class="v"><span class="status" data-bd-status>—</span></span></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:0;">
      <h2>Repasse</h2>
      <div class="bc-summary" style="margin-bottom:0;">
        <div class="line"><span class="muted">Valor da reserva</span><span class="num" data-bd-valor>—</span></div>
        <div class="line"><span class="muted" data-bd-taxa-label>Comissão Qadras</span><span class="num" data-bd-taxa>—</span></div>
        <div class="line total"><span>Você recebe</span><span class="num" data-bd-repasse>—</span></div>
      </div>
    </div>
  </div>

  <aside>
    <div class="card">
      <h2>Cliente</h2>
      <div class="cli" style="margin-bottom:16px;"><span class="av" data-bd-ini>?</span> <b data-bd-cliente>—</b></div>
      <div class="bc-fields" style="margin-top:0;">
        <div class="bc-field"><span class="k"><svg class="ic"><use href="#i-user"/></svg> Telefone</span><span class="v num" data-bd-telefone>—</span></div>
        <div class="bc-field"><span class="k"><svg class="ic"><use href="#i-star"/></svg> Reservas</span><span class="v" data-bd-historico>—</span></div>
      </div>
      <a href="./dashboard.html#mensagens" class="btn btn-outline btn-block" style="margin-top:14px;">
        <svg class="ic sm"><use href="#i-chat"/></svg> Falar com o cliente
      </a>
    </div>

    <div class="card" style="margin-bottom:0;">
      <h2>Ações</h2>
      <!-- As acoes disponiveis dependem do status: uma reserva ja recusada
           nao tem o que aprovar. Montadas no JS. -->
      <div data-bd-actions></div>
    </div>
  </aside>
</div>
