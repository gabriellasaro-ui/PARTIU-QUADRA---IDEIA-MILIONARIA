<!-- PERFIL DA ARENA — a vitrine entre a busca e a quadra.

     O topo e A LOGO E O NOME LOGO ABAIXO.

     Nao ha galeria aqui: a arena nao tem album proprio (as fotos sao das
     quadras e se repetem nos cards abaixo), e bastava uma nao carregar para o
     perfil abrir com um retangulo vazio do tamanho do celular. Quem entra aqui
     quer saber DE QUEM e o lugar.

     SAIU O SELO "ARENA VERIFICADA". Nao existe campo de verificacao no banco
     nem processo nenhum por tras dele — era um selo de confianca afirmando
     algo que o produto nao faz. Enquanto nao houver um criterio de verdade
     (documento conferido, visita, o que for), o selo mente para quem esta
     decidindo onde gastar dinheiro.

     E nao ha telefone, WhatsApp, e-mail nem rua: quem sai daqui com o contato
     fecha por fora e a reserva nao acontece. O backend nem envia esses campos. -->
<div class="route-page arena-page" data-arena-page>
  <header class="arena-topo">
    <div class="arena-topo__barra">
      <a data-voltar class="back" href="#quadras" aria-label="Voltar"><i class="ic" data-lucide="chevron-left"></i></a>
      <!-- Favoritar ja opera por arena no banco (`UserFavorite.arena_id`). -->
      <button class="hero-favorite" type="button" data-favorite-toggle aria-label="Salvar nos favoritos">
        <i class="ic" data-lucide="heart"></i>
      </button>
    </div>

    <span class="arena-topo__logo" data-arena-logo aria-hidden="true"></span>
    <h1 data-arena-name></h1>
    <p class="arena-topo__local"><i class="ic" data-lucide="map-pin"></i><span data-arena-local></span></p>
  </header>

  <div class="container arena-body">
    <!-- Os numeros que decidem: nota, quantas quadras, e a partir de quanto.
         Em cartao e em corpo grande — antes eram tres linhas de 11px que
         ninguem lia. -->
    <div class="arena-numeros">
      <div>
        <b data-arena-rating></b>
        <span class="arena-numeros__estrelas" data-arena-stars aria-hidden="true"></span>
        <small data-arena-reviews></small>
      </div>
      <div>
        <b data-arena-courts></b>
        <small>quadras</small>
      </div>
      <div>
        <b data-arena-price></b>
        <small>a partir de</small>
      </div>
    </div>

    <!-- O botao "Ver no mapa" saiu daqui a pedido. O caminho para o mapa
         continua no card de cada quadra, que e onde a pergunta "e longe?"
         aparece junto com o horario e o preco. -->

    <section class="arena-cartao" data-arena-sobre hidden>
      <h2>Sobre a arena</h2>
      <p class="arena-sobre" data-arena-descricao></p>
    </section>

    <!-- COMODIDADES DA ARENA: a uniao do que esta marcado nas quadras.
         Vestiario e estacionamento sao do LUGAR, e o dono ja cadastra isso em
         cada quadra — pedir de novo garantiria que os dois divergissem. -->
    <section class="arena-cartao" data-arena-comodidades-section hidden>
      <h2>O que a arena tem</h2>
      <div class="arena-comodidades" data-arena-comodidades></div>
    </section>

    <section class="arena-secao">
      <h2>Quadras disponíveis <small data-arena-courts-label></small></h2>
      <!-- Os mesmos cards da busca, sem o nome da arena repetido: aqui ele
           esta no topo da tela e sairia identico em todos eles. -->
      <div class="arena-court-list" data-arena-court-list></div>
    </section>

    <section class="arena-secao" data-arena-reviews-section hidden>
      <h2>Avaliações</h2>
      <!-- Resumo antes da lista: a nota media e o que a pessoa quer primeiro;
           os comentarios sao a explicacao dela. -->
      <div class="arena-nota">
        <div class="arena-nota__valor">
          <b data-arena-review-media></b>
          <span data-arena-review-stars aria-hidden="true"></span>
        </div>
        <p data-arena-review-count></p>
      </div>
      <!-- ORDEM: melhores primeiro, por padrao.

           A lista vinha por data, entao a primeira coisa lida era a avaliacao
           mais recente — que pode ser a pior. Quem abre as avaliacoes de um
           lugar quer saber se vale a pena; comecar pelas melhores responde
           isso, e quem desconfia inverte num toque. -->
      <div class="arena-ordem" role="group" aria-label="Ordenar avaliações">
        <button type="button" data-arena-ordem="nota" class="on">Maiores notas</button>
        <button type="button" data-arena-ordem="data">Mais recentes</button>
      </div>
      <div class="arena-review-list" data-arena-review-list></div>
      <button type="button" class="arena-review-mais" data-arena-review-mais hidden></button>
    </section>
  </div>
</div>
