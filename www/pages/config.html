<!-- TODO: substituir configurações locais por GET/PATCH /configurações na API FastAPI -->
<div class="route-page">
  <div class="navbar">
    <a data-voltar class="icon-btn" href="#home" aria-label="Voltar"><i class="ic" data-lucide="chevron-left"></i></a>
    <div><div class="title">Configurações</div><div class="sub">Preferências e privacidade</div></div>
  </div>

  <form class="container mobile-settings" data-demo-form data-success="Configurações salvas">
    <section class="settings-section">
      <h2>Notificações</h2>
      <label class="switch-row"><span>Reserva confirmada<small>Avisar assim que a arena confirmar</small></span><span class="switch on"></span></label>
      <label class="switch-row"><span>Lembrete do jogo<small>Uma hora antes do horário</small></span><span class="switch on"></span></label>
      <label class="switch-row"><span>Quadras novas por perto</span><span class="switch"></span></label>
      <label class="switch-row"><span>Promoções e cupons</span><span class="switch on"></span></label>
    </section>

    <section class="settings-section">
      <h2>Preferências de jogo</h2>
      <div class="field"><label>Esporte padrão</label><div class="select-wrap"><select><option>Futebol Society</option><option>Beach Tennis</option><option>Volei</option><option>Basquete</option><option>Tenis</option><option>Futsal</option></select></div></div>
      <div class="field"><label>Distância padrão</label><div class="select-wrap"><select><option>Até 2 km</option><option selected>Até 5 km</option><option>Até 10 km</option></select></div></div>
    </section>

    <section class="settings-section">
      <h2>Privacidade</h2>
      <label class="switch-row"><span>Mostrar meu nome para a arena<small>Usado para identificar a reserva</small></span><span class="switch on"></span></label>
      <label class="switch-row"><span>Compartilhar estatísticas</span><span class="switch"></span></label>
    </section>

    <button class="btn block" type="submit">Salvar alterações</button>
    <!-- Botao, e nao link: e acao, nao navegacao. Antes era
         <a href="#home"> e nao limpava sessao nenhuma. -->
    <button class="logout-link" type="button" data-auth-logout>Sair da conta</button>
  </form>
</div>
