<!-- TODO: substituir configurações locais por GET/PATCH /configurações na API FastAPI -->
<div class="route-page">
  <div class="navbar">
    <a data-voltar class="icon-btn" href="#home" aria-label="Voltar"><i class="ic" data-lucide="chevron-left"></i></a>
    <div><div class="title">Configurações</div><div class="sub">Preferências e privacidade</div></div>
  </div>

  <!-- Este formulario era data-demo-form: dizia "Configuracoes salvas" e nao
       gravava nada. Agora cada controle grava no servidor ao ser tocado, e por
       isso o botao "Salvar alteracoes" tambem saiu — nao havia mais o que
       salvar depois, e um botao que nao faz nada e pior que nenhum.

       As duas opcoes que sobraram de notificacao sao as que EXISTEM de fato no
       backend. "Quadras novas por perto" e "Promocoes e cupons" foram
       removidas: nao ha nada que as envie, entao eram interruptores ligados a
       lugar nenhum. -->
  <form class="container mobile-settings" data-config-form>
    <section class="settings-section">
      <h2>Notificações</h2>
      <label class="switch-row" data-cfg="notifyBooking"><span>Reserva confirmada<small>Avisar assim que a arena confirmar</small></span><span class="switch on"></span></label>
      <label class="switch-row" data-cfg="notifyReminder"><span>Lembrete do jogo<small>Uma hora antes do horário</small></span><span class="switch on"></span></label>
      <label class="switch-row" data-cfg="notifyClub"><span>Mensagens do clube<small>Quando alguém escrever no mural</small></span><span class="switch on"></span></label>
    </section>

    <section class="settings-section">
      <h2>Preferências de jogo</h2>
      <div class="field"><label>Esporte padrão</label><div class="select-wrap"><select data-cfg-select="favoriteSport" data-cfg-esportes></select></div></div>
      <div class="field"><label>Distância padrão</label><div class="select-wrap"><select data-cfg-select="searchRadius">
        <option value="2">Até 2 km</option>
        <option value="5">Até 5 km</option>
        <option value="10">Até 10 km</option>
        <option value="25">Até 25 km</option>
      </select></div></div>
    </section>

    <!-- A secao Privacidade saiu inteira.

         "Mostrar meu nome para a arena" nao podia ser opcional: a arena
         precisa saber quem reservou para receber a pessoa no portao, e o nome
         ja vai na reserva de qualquer jeito. Um interruptor que nao pode ser
         desligado e pior que interruptor nenhum — promete um controle que nao
         existe.

         "Compartilhar estatisticas" nao tinha nem definicao: nao havia nada no
         backend lendo isso, nem tela mostrando estatistica de ninguem para
         ninguem. Era um botao esperando um significado. -->

    <section class="settings-section">
      <h2>Aparência</h2>
      <!-- Claro de fabrica. O escuro e escolha, e fica gravada no aparelho. -->
      <label class="switch-row" data-cfg-tema>
        <span>Modo escuro<small>Fundo escuro para jogar à noite</small></span>
        <span class="switch"></span>
      </label>
    </section>

    <!-- Sair era um link miudo de 13px no rodape, do tamanho de uma nota de
         pe de pagina — para a acao que a pessoa mais procura nesta tela.
         Vira botao de verdade.

         Excluir conta nao existia no app (so na web), e e exigencia das lojas:
         quem cria conta pelo aplicativo precisa conseguir apaga-la por ele. -->
    <div class="conta-acoes">
      <!-- Trocar senha vive aqui, junto de sair e excluir: sao as tres acoes
           de CONTA, e nao de preferencia. Some para quem entra pelo Google,
           que nao tem senha local para trocar. -->
      <button class="btn outline block" type="button" data-cfg-senha hidden>
        <i class="ic" data-lucide="key-round"></i>Alterar senha
      </button>
      <button class="btn outline block" type="button" data-auth-logout>
        <i class="ic" data-lucide="log-out"></i>Sair da conta
      </button>
      <button class="btn outline block conta-acoes__excluir" type="button" data-cfg-excluir>
        <i class="ic" data-lucide="trash-2"></i>Excluir minha conta
      </button>
      <p class="conta-acoes__aviso">Excluir apaga perfil, favoritos e preferências. Não dá para desfazer.</p>
    </div>
  </form>
</div>
