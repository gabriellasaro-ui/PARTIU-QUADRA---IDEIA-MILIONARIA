<div class="route-page">
  <div class="navbar">
    <a class="icon-btn" href="#perfil" aria-label="Voltar ao perfil"><i class="ic" data-lucide="chevron-left"></i></a>
    <div><div class="title">Configuracoes</div><div class="sub">Preferencias e privacidade</div></div>
  </div>

  <form class="container mobile-settings" data-demo-form data-success="Configuracoes salvas">
    <section class="settings-section">
      <h2>Notificacoes</h2>
      <label class="switch-row"><span>Reserva confirmada<small>Avisar assim que a arena confirmar</small></span><span class="switch on"></span></label>
      <label class="switch-row"><span>Lembrete do jogo<small>Uma hora antes do horario</small></span><span class="switch on"></span></label>
      <label class="switch-row"><span>Quadras novas por perto</span><span class="switch"></span></label>
      <label class="switch-row"><span>Promocoes e cupons</span><span class="switch on"></span></label>
    </section>

    <section class="settings-section">
      <h2>Preferencias de jogo</h2>
      <div class="field"><label>Esporte padrao</label><div class="select-wrap"><select><option>Futebol Society</option><option>Beach Tennis</option><option>Volei</option><option>Basquete</option><option>Tenis</option><option>Futsal</option></select></div></div>
      <div class="field"><label>Distancia padrao</label><div class="select-wrap"><select><option>Ate 2 km</option><option selected>Ate 5 km</option><option>Ate 10 km</option></select></div></div>
    </section>

    <section class="settings-section">
      <h2>Privacidade</h2>
      <label class="switch-row"><span>Mostrar meu nome para a arena<small>Usado para identificar a reserva</small></span><span class="switch on"></span></label>
      <label class="switch-row"><span>Compartilhar estatisticas</span><span class="switch"></span></label>
    </section>

    <button class="btn block" type="submit">Salvar alteracoes</button>
    <a class="logout-link" href="#home">Sair da conta</a>
  </form>
</div>
