<!DOCTYPE html>
<!-- data-manager-app: as 599 regras do manager-app.css vivem sob esse
     atributo. Sem ele a folha carrega e nao pinta nada. -->
<html lang="pt-br" data-page="dashboard" data-manager-app data-manager-view="dashboard">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dashboard - Qadras</title>
  <meta name="theme-color" content="#1b7a3e">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/desktop.css">
  <!-- 3339 linhas de estilo do painel do gerente que nunca eram carregadas.
       O app antigo carregava as duas folhas; na refatoracao so a primeira
       veio, e por isso metade das telas parecia sem acabamento. -->
  <link rel="stylesheet" href="./assets/css/manager-app.css">
</head>
<body>
  <div data-component="./components/icons/sprite.html"></div>
  <div class="app" id="app">
    <div class="sb-backdrop" data-nav-close></div>
    <div data-component="./components/sidebar/manager-sidebar.html"></div>
    <div class="main">
      <div data-component="./components/header/app-topbar.html"></div>
      <div class="content">
        <!-- Sem data-current-route aqui. O atributo escrito na mao fazia o
             roteador achar que ja tinha montado a rota e sair pelo caminho
             curto, entao renderManagerOverview nunca rodava e o painel ficava
             com todos os numeros zerados, sem erro nenhum no console.
             O conteudo vem do roteador, como em todas as outras rotas. -->
        <main data-desktop-route-view></main>
      </div>
      <div data-component="./components/navbar/manager-tabbar.html"></div>
    </div>
  </div>
  <div data-component="./components/modal/schedule-modal.html"></div>
  <div data-component="./components/toast/toast.html"></div>
  <script src="./assets/js/ui.js" defer></script>
  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
