<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% block title %}Partiu Quadra{% endblock %}</title>

  <!-- PWA -->
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <meta name="theme-color" content="#1b7a3e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Partiu Quadra">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-180.png') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32.png') }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <!-- Sprite de icones (sem emojis) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.9 5.9 6.1.9-4.4 4.3 1 6.1L12 17.8 6.4 20.2l1-6.1L3 9.8l6.1-.9L12 3Z"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M16 3v4M8 3v4M3.5 10h17"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6.5 9.5 17 4 11.5"/></symbol>
      <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2 4 13h7l-1 9 9-12h-7l1-8Z"/></symbol>
      <symbol id="i-card" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/></symbol>
      <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18a1 1 0 0 1 1 1v1.5"/><path d="M3 7.5V17a2.5 2.5 0 0 0 2.5 2.5H19a2 2 0 0 0 2-2V11a2 2 0 0 0-2-2H5.5"/><path d="M17 13.5h.01"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1Z"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16"/><path d="M8 16v-4M13 16V8M18 16v-6"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 5.5V11c0 5 7 9 7 9s7-4 7-9V5.5L12 3Z"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h11M4 12h7M4 17h14"/><circle cx="18" cy="7" r="2"/><circle cx="14" cy="12" r="2"/><circle cx="20" cy="17" r="2"/></symbol>
      <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2Z"/><path d="M9 21h6M10 18v3M14 18v3"/></symbol>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2s5 3.5 5 9a5 5 0 0 1-10 0c0-2 1-3.4 2-4.2.2 1.5 1 2.2 2 2.2 0-2-1-3.6 1-7Z"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M3 7l6 6 4-4 8 8"/><path d="M21 13v4h-4"/></symbol>
      <symbol id="i-dollar" viewBox="0 0 24 24"><path d="M12 2v20M17 6.5C17 4.6 14.8 3.5 12 3.5S7 4.8 7 7s2.5 3 5 3.5 5 1.3 5 3.5-2.2 3.5-5 3.5S7 19.4 7 17.5"/></symbol>
    </defs>
  </svg>

  <div class="app-wrap">
    <div class="phone">
      <div class="screen">
        {% block content %}{% endblock %}
      </div>

      <div class="pwa-prompt" id="pwa-install" hidden>
        <span class="logo-mark"><svg class="ic"><use href="#i-pin"/></svg></span>
        <div class="pwa-tx">
          <strong>Instalar o Partiu Quadra</strong>
          <small>Acesso rápido direto da tela inicial</small>
        </div>
        <button class="pwa-go" id="pwa-go" type="button">Instalar</button>
        <button class="pwa-x" id="pwa-x" type="button" aria-label="Fechar">
          <svg class="ic sm"><use href="#i-x"/></svg>
        </button>
      </div>

      <nav class="tabbar">
        <a href="{{ url_for('index') }}" class="{{ 'on' if active == 'home' }}">
          <svg class="ic"><use href="#i-home"/></svg><span>Início</span>
        </a>
        <a href="{{ url_for('buscar') }}" class="{{ 'on' if active == 'mapa' }}">
          <svg class="ic"><use href="#i-grid"/></svg><span>Quadras</span>
        </a>
        <a href="{{ url_for('reservas') }}" class="{{ 'on' if active == 'reservas' }}">
          <svg class="ic"><use href="#i-calendar"/></svg><span>Reservas</span>
        </a>
      </nav>

      <div class="toast" id="pq-toast" hidden>
        <svg class="ic"><use href="#i-check"/></svg>
        <span data-toast-msg></span>
      </div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/pwa.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/ui.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
